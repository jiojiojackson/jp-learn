<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1430" media="(prefers-color-scheme: dark)">
<title>日语专注修行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F2B93B'/%3E%3Ctext x='32' y='47' font-size='40' font-weight='700' text-anchor='middle' fill='%233A2A00' font-family='sans-serif'%3E日%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#EEF1F8;--surface:#fff;--ink:#16204A;--muted:#5C6690;--line:#D5DBEC;--track:#E3E8F5;
  --gold:#F2B93B;--goldink:#3A2A00;--pink:#D6456B;--pri:#243B8F;--priink:#fff;--ok:#2E8B6E;
  --shadow:0 1px 2px rgba(22,32,74,.05),0 8px 24px -12px rgba(22,32,74,.18);
  --r:16px;
  /* 只用系统字体：中日英文统一风格，不依赖外部字体服务 */
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei","Hiragino Sans","Yu Gothic UI",sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1430;--surface:#18204A;--ink:#EAEFFF;--muted:#9AA6D6;--line:#2A3566;--track:#232D5E;
  --pri:#6F8CFF;--priink:#0E1430;--ok:#52C9A2;--pink:#F27C9B;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1430;--surface:#18204A;--ink:#EAEFFF;--muted:#9AA6D6;--line:#2A3566;--track:#232D5E;
  --pri:#6F8CFF;--priink:#0E1430;--ok:#52C9A2;--pink:#F27C9B;--shadow:none;color-scheme:dark}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{margin:0}
h2{font-size:1.02rem;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
small{font-size:.82rem}
.note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.sec+.sec,.sec+.sec-gap{margin-top:28px}

/* ============ 页面骨架 ============ */
.app{max-width:640px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font-weight:800;font-size:1.3rem;line-height:1}
.top h1{flex:1;font-size:1.3rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync[data-s="wait"]::before{background:var(--gold)}
.sync[data-s="err"]::before{background:var(--pink)}
.layout{margin-top:16px}
.layout>main{margin-top:28px}

/* ============ 等级卡 ============ */
.hud{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.lv{flex:none;width:56px;height:56px;border-radius:16px;background:var(--pri);color:var(--priink);display:grid;place-items:center;text-align:center;line-height:1}
.lv small{display:block;font-size:.58rem;letter-spacing:.12em;opacity:.8;margin-bottom:3px}
.lv b{font-size:1.5rem;font-weight:800}
.xp{flex:1;min-width:0}
.xp>b{font-weight:700}
.xp small{color:var(--muted)}
.track{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin:5px 0 4px}
.track i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}
.pts{flex:none;text-align:right}
.pts b{display:block;font-size:1.9rem;font-weight:800;line-height:1.1}
.pts small{color:var(--muted)}

/* ============ 学习目标 ============ */
.goal{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);transition:border-color .2s}
.goal.on{border-color:var(--pri)}
.goal header{display:flex;align-items:center;gap:10px}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;min-height:36px;font-weight:700;font-size:1.02rem;text-align:left}
.pick .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);transition:border-color .2s,background .2s}
.goal.on .pick .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 4.5px,transparent 5.5px)}
.pick .nm{overflow-wrap:anywhere}
.cnt{flex:none;font-weight:800;font-size:1.1rem}
.cnt i{font-style:normal;font-weight:500;color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:6px;background:var(--track);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .35s}
.goal footer{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;color:var(--muted);font-size:.85rem}
.goal .meta{flex:1;min-width:0}
.chip{font-style:normal;font-size:.72rem;font-weight:700;color:var(--priink);background:var(--pri);border-radius:999px;padding:1px 8px;margin-right:6px;white-space:nowrap}
.ghost{background:none;border:0;border-radius:8px;color:var(--muted);padding:6px 10px;min-height:36px;font-size:.85rem}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.warn{color:var(--pink);font-weight:700}
.tap{width:100%;margin-top:6px;min-height:52px;border:0;border-radius:12px;background:var(--gold);color:var(--goldink);font-weight:700;font-size:1.05rem;transition:transform .08s,filter .15s}
.tap:active:not(:disabled){transform:scale(.98)}
.tap:disabled{background:var(--track);color:var(--muted);cursor:default}
.cnt .done{font-style:normal;font-size:.72rem;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:999px;padding:2px 9px;margin-right:8px;vertical-align:2px}
.goal.fin footer{margin-top:-2px}
.empty{color:var(--muted);margin:0 0 12px;padding:16px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;font-size:.95rem;text-wrap:balance}

/* 添加目标 */
.add{display:grid;grid-template-columns:112px 1fr;gap:8px;margin-top:4px}
.add .nm{grid-column:1/-1}
.field{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;width:100%;min-width:0}
.field::placeholder{color:var(--muted);opacity:.75}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--pri);color:var(--priink);font-weight:700}
.btn:active{filter:brightness(.92)}
.btn.block{width:100%;margin-top:14px}

/* ============ 统计 ============ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.cell b{display:block;font-size:1.4rem;font-weight:800;line-height:1.2;white-space:nowrap}
.cell b .u{font-size:.78rem;font-weight:600;color:var(--muted);margin:0 3px 0 2px}
.cell small{color:var(--muted)}

/* 近七天 */
.week{--ch:112px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 10px;box-shadow:var(--shadow)}
.col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font-size:.74rem;color:var(--muted)}
.col .v{height:1.1em;line-height:1.1;font-weight:700;color:var(--ink)}
.col .t{width:100%;max-width:38px;height:var(--ch);background:var(--track);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.col .b{width:100%;background:var(--pri);border-radius:8px}
.col.today .b{background:var(--gold)}
.col.today .w{color:var(--ink);font-weight:700}
.col .f{height:1.1em;font-size:.68rem}

/* 排行榜 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.rank li.me{border:2px solid var(--gold);padding:9px 13px}
.no{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--track);font-weight:800;font-size:.95rem}
.rank li:nth-child(1) .no{background:var(--gold);color:var(--goldink)}
.rank li:nth-child(2) .no{background:#B9C2DA;color:#1d2540}
.rank li:nth-child(3) .no{background:#D79B6B;color:#2c1500}
.rank .d{flex:1;min-width:0}
.rank .d b{font-weight:700}
.rank .d small{display:block;color:var(--muted)}
.rank .p{flex:none;font-size:1.3rem;font-weight:800}
.rank .p i{font-style:normal;font-size:.75rem;font-weight:600;color:var(--muted);margin-left:2px}

/* 成就 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bd{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.bd .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--track);color:var(--muted)}
.bd .tx{min-width:0}
.bd b{display:block;line-height:1.3}
.bd small{display:block;color:var(--muted);line-height:1.35}
.bd.lock b{color:var(--muted)}
.bd.got .ic{background:var(--gold);color:var(--goldink)}
.bd.got b{color:var(--pink)}
.bd .when{margin-top:2px;font-size:.72rem}

/* ============ 计时器（手机：底部固定条） ============ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 28px -14px rgba(22,32,74,.35)}
.strip{height:4px;background:var(--track);margin:0 -16px 10px;overflow:hidden}
.strip i{display:block;height:100%;width:0;background:var(--gold);transition:width 1s linear}
.dockin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.clock{flex:1;min-width:0}
.clock b{display:block;font-size:2.1rem;font-weight:800;line-height:1.1;letter-spacing:.01em}
.clock small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{flex:none;display:flex;align-items:center;gap:8px}
.go{min-width:108px;min-height:54px;border:0;border-radius:999px;background:var(--pri);color:var(--priink);font-weight:700;font-size:1.1rem;padding:0 24px;transition:background .2s,transform .08s}
.go:active{transform:scale(.97)}
.go.run{background:var(--pink);color:#fff}
.fin{min-height:44px;padding:0 14px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.fin[hidden]{display:none}
.kbd{display:none;margin:12px 0 0;text-align:center;font-size:.8rem;color:var(--muted)}
.kbd kbd{font:inherit;font-size:.75rem;padding:1px 8px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);color:var(--ink)}

/* 提示条 */
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* 弹窗：手机为底部抽屉 */
.veil{position:fixed;inset:0;background:rgba(10,14,36,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.veil.on{display:flex}
.card{background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:90%;overflow:auto;animation:up .25s ease-out}
.card h2{margin:0 0 4px;font-size:1.3rem;font-weight:800}
.card .grid{margin:14px 0}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:360px){
  .app{padding-left:12px;padding-right:12px}
  .cell{padding:10px}.cell b{font-size:1.2rem}
  .go{min-width:92px;padding:0 18px}
}

/* ============ 平板 / 小窗口：统计放宽 ============ */
@media(min-width:640px){
  .veil{align-items:center;padding:16px}
  .card{border-radius:24px;max-width:440px;padding:24px}
  .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
}

/* ============ 电脑：双栏布局 ============ */
@media(min-width:960px){
  .app{max-width:1160px;padding:0 32px 56px}
  .top{padding:28px 0 18px}
  .top h1{font-size:1.6rem}
  .layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start;margin-top:20px}
  .layout>main{margin-top:0}
  /* 左栏：计时器 + 目标，随页面滚动保持可见 */
  .side{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 40px)}
  .goals-sec{overflow-y:auto;min-height:0;padding:3px;margin:-3px;overscroll-behavior:contain;scrollbar-width:thin}
  .dock{position:relative;left:auto;right:auto;bottom:auto;flex:none;border:1px solid var(--line);border-radius:20px;padding:0 22px 22px;box-shadow:var(--shadow);overflow:hidden}
  .strip{margin:0 -22px 20px;height:5px}
  .dockin{display:grid;gap:16px;max-width:none}
  .clock b{font-size:3.6rem;letter-spacing:.02em}
  .clock small{font-size:.9rem;margin-top:2px}
  .btns{width:100%}
  .go{flex:1;min-height:56px;font-size:1.15rem}
  .fin{min-height:56px;padding:0 22px}
  .go:hover{filter:brightness(1.08)}
  .kbd{display:block}
  .toast{bottom:32px}
  /* 右栏 */
  .cell{padding:16px 18px}
  .cell b{font-size:1.75rem}
  .week{--ch:168px;gap:12px;padding:18px 18px 14px}
  .col{font-size:.82rem}
  .col .t{max-width:56px}
  .col .f{font-size:.74rem}
  .hud{padding:18px 24px;gap:20px}
  .lv{width:64px;height:64px}
  .lv b{font-size:1.7rem}
  .track{height:12px}
  .pts b{font-size:2.3rem}
}
@media(hover:hover){
  .tap:hover:not(:disabled){filter:brightness(1.06)}
  .btn:hover{filter:brightness(1.1)}
  .ghost:hover:not(:disabled){background:var(--track)}
  .goal:not(.on):hover{border-color:var(--muted)}
  .fin:hover{background:var(--track)}
}
@media(min-width:1280px){.badges{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ============ 升级：任务 / 热力图 / 成就稀有度 / 庆祝 ============ */
.mute{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:28px;font-size:.9rem;padding:0}
.pts .fl{display:block;color:var(--pink);font-weight:700}
.qs{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.qs.ok{border-color:var(--ok)}.qs .qi{font-size:1.3rem}.qs .qt{flex:1;min-width:0}.qs .qt .bar{margin:6px 0 0;height:8px}.qs small{flex:none;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--track)}
.heat .l1{background:color-mix(in srgb,var(--ok) 30%,var(--track))}.heat .l2{background:color-mix(in srgb,var(--ok) 55%,var(--track))}
.heat .l3{background:color-mix(in srgb,var(--ok) 80%,var(--track))}.heat .l4{background:var(--ok)}.heat .td{outline:2px solid var(--gold);outline-offset:1px}
.bd .ic{font-size:1.25rem}.bd.lock .ic{filter:grayscale(1);opacity:.5}
.bd.got.r1 .ic{background:#D79B6B}.bd.got.r2 .ic{background:#B9C2DA}.bd.got.r3 .ic{background:var(--gold)}
.bd.got.r4 .ic{background:linear-gradient(135deg,#7AE0FF,#B38BFF)}.bd.got.r4{border-color:#9C8CFF}
.bd .rt{font-style:normal;font-size:.66rem;font-weight:700;border-radius:999px;padding:0 7px;background:var(--track);color:var(--muted);vertical-align:2px}
.bd .pg{height:6px;border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden}.bd .pg i{display:block;height:100%;background:var(--pri)}
.card.cele{position:relative;overflow:hidden;text-align:center}.card .big{font-size:3.4rem;line-height:1.2;margin-top:6px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-30px;font-style:normal;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(460px) rotate(360deg);opacity:0}}

/* ============ 分页 UI：底部悬浮标签栏 + 圆环计时器 ============ */
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.views{margin-top:16px}
.view{animation:vin .28s ease-out}.view[hidden]{display:none!important}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#v-focus>*+*{margin-top:24px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:440px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 34px -14px rgba(22,32,74,.45)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:none;border-radius:18px;min-height:54px;padding:6px 4px;color:var(--muted);font-size:.74rem;font-weight:700;transition:background .2s,color .2s}
.tabs button.on{background:var(--pri);color:var(--priink)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs small{font-size:.62rem;font-weight:600;opacity:.85;line-height:1}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:700;
  padding:10px 18px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini[hidden]{display:none}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.dock{position:relative;left:auto;right:auto;bottom:auto;z-index:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;box-shadow:var(--shadow);text-align:center;overflow:visible}
.strip{display:none}
.ringw{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:0 auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:7}
.ringw .rt{stroke:var(--track)}
.ringw .rp{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1s linear}
.ringw .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20%}
.ringw .clock b{font-size:clamp(2rem,9vw,2.7rem)}
.ringw .clock small{max-width:100%}
.dock .btns{justify-content:center;margin-top:18px}
.dock .go{min-width:150px;flex:none}
.dock .note{margin-top:12px;font-size:.8rem}
.goals-sec{overflow:visible;margin:0;padding:0}
@media(min-width:960px){
  .views{margin-top:24px}
  #v-focus{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto 1fr;gap:24px 32px;align-items:start}
  #v-focus>*+*{margin-top:0}
  #v-focus .dock{grid-row:1/3;position:sticky;top:20px;padding:28px 24px 22px}
  #dash{display:grid;grid-template-columns:1fr 1fr;gap:28px 32px;align-items:start}
  #dash .sec{margin:0}
  .toast{bottom:100px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo" aria-hidden="true">日</span>
    <h1>日语专注修行</h1>
    <span class="sync" id="sync" data-s="wait" role="status" aria-live="polite">连接中…</span>
  <button class="mute" id="mute" aria-label="音效开关"></button>
  </header>

  <section class="hud" id="hud" aria-label="等级与今日积分"></section>

  <div class="views">
    <div class="view" id="v-focus">
      <section class="dock" aria-label="计时器">
        <div class="strip"><i id="strip"></i></div>
        <div class="ringw">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rt" cx="60" cy="60" r="54"/><circle class="rp" id="ring" cx="60" cy="60" r="54"/></svg>
          <div class="clock"><b id="clk">00:00</b><small id="sub">选择目标后点击开始</small></div>
        </div>
        <div class="btns"><button class="fin" id="end" hidden>结束</button><button class="go" id="go">开始</button></div>
        <p class="note">圆环 = 25 分钟连续专注进度，暂停会重置</p>
        <p class="kbd">按 <kbd>空格</kbd> 开始 / 暂停</p>
      </section>
      <div id="quests"></div>
      <section class="goals-sec">
        <h2>学习目标</h2>
        <div id="goals"></div>
        <form class="add" id="gform" autocomplete="off">
          <input class="field nm" id="gname" placeholder="目标，例如：N3 单词" maxlength="30" aria-label="目标名称" enterkeyhint="next">
          <input class="field num" id="gtotal" type="number" inputmode="numeric" min="1" max="999" placeholder="项目数" aria-label="项目数" enterkeyhint="done">
          <button class="btn" id="gadd" type="submit">添加目标</button>
        </form>
      </section>
    </div>
    <div class="view" id="v-stats" hidden><main id="dash"></main></div>
    <div class="view" id="v-badges" hidden><div id="bdg"></div></div>
  </div>
  <nav class="tabs" aria-label="页面导航">
    <button data-t="focus" class="on" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>专注</button>
    <button data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>数据</button>
    <button data-t="badges"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>成就<small id="bc"></small></button>
  </nav>
  <button class="mini" id="mini" hidden></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
const TOKEN_KEY="jp-focus-token",APP_TITLE="日语专注修行";
let S={goals:[],activeId:null,days:{},session:null,badges:{},flags:{}},pendDel=null,tickN=0,toastT=null;
let loaded=false,rev=0,pushT=null,pushing=false,again=false,lock=false;
const dirty=new Set();

/* ---- sync with Cloudflare D1 (via the Worker API) ---- */
const tok=()=>{try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return""}};
function api(method,body,keep){const h={"content-type":"application/json"},t=tok();if(t)h.Authorization="Bearer "+t;
  return fetch("/api/state",{method,headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keep})}
function setSync(t){const el=document.getElementById("sync");if(!el)return;el.textContent=t;el.dataset.s=t==="已同步"?"ok":/失败/.test(t)?"err":"wait"}
function modal(html,locked){lock=!!locked;document.getElementById("card").innerHTML=html;document.getElementById("veil").classList.add("on")}
function unmodal(){lock=false;document.getElementById("veil").classList.remove("on");document.getElementById("card").classList.remove("cele");if(pendC.length){const a=pendC.shift();setTimeout(()=>celebrate(...a),300)}}
function save(){if(!loaded)return;setSync("待同步");clearTimeout(pushT);pushT=setTimeout(push,800)}
async function push(keep){
  if(!loaded)return;
  if(pushing){again=true;return}
  clearTimeout(pushT);pushT=null;pushing=true;
  if(S.session)flush();
  const ks=[...dirty];dirty.clear();
  const body={rev,goals:S.goals,activeId:S.activeId,session:S.session,badges:S.badges,flags:S.flags,days:Object.fromEntries(ks.map(k=>[k,S.days[k]]))};
  setSync("同步中…");
  try{
    const r=await api("PUT",body,keep);
    if(r.status===409){pushing=false;await pull(true);toast("已载入其他设备的最新数据，请重做刚才的操作");return}
    if(r.status===401){pushing=false;ks.forEach(k=>dirty.add(k));askToken();return}
    if(!r.ok)throw new Error("http "+r.status);
    rev=(await r.json()).rev;setSync("已同步");
  }catch(e){ks.forEach(k=>dirty.add(k));setSync("同步失败，10 秒后重试");pushT=setTimeout(push,10000)}
  pushing=false;if(again){again=false;push()}
}
async function pull(force){
  if(!force&&(dirty.size||pushT))await push();
  const r=await api("GET");
  if(r.status===401){askToken();return false}
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();
  S=Object.assign({goals:[],days:{},activeId:null,session:null,badges:{},flags:{}},j.state);
  rev=j.rev;dirty.clear();loaded=true;setSync("已同步");render();return true;
}
function askToken(){
  modal(`<h2>需要访问口令</h2><p class="note">请输入部署时设置的 ACCESS_TOKEN。</p>
  <input class="field" id="tk" type="password" autocomplete="current-password" style="margin-top:12px" aria-label="访问口令">
  <button class="btn block" id="tkok">确认</button>`,true);
  const go=()=>{try{localStorage.setItem(TOKEN_KEY,document.getElementById("tk").value.trim())}catch(e){}boot()};
  document.getElementById("tkok").onclick=go;
  document.getElementById("tk").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function boot(){
  modal('<p class="note" style="margin:0">正在加载数据…</p>',true);
  try{if(await pull(true))unmodal()}
  catch(e){modal('<h2>无法连接服务器</h2><p class="note">请检查网络后重试。</p><button class="btn block" id="retry">重试</button>',true);document.getElementById("retry").onclick=boot}
}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dk=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const day=k=>{dirty.add(k);return S.days[k]||(S.days[k]={ms:0,pauseMs:0,items:0,pts:0,sessions:0,pauses:0,best:0})};
const goal=id=>S.goals.find(g=>g.id===id);
const clock=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+":"+pad(m):pad(m))+":"+pad(s)};
const mins=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+" 小时 "+(m%60)+" 分":m+" 分钟"};
/* 数值 + 小号单位（统一字体，避免数字和单位大小混乱） */
const u=(n,unit)=>`${n}<span class="u">${unit}</span>`;
const minsH=ms=>{const m=Math.round(ms/60000);return m>=60?u(Math.floor(m/60),"时")+u(m%60,"分"):u(m,"分钟")};
const BLOCK=25*60000;

function live(){const s=S.session;if(!s)return{act:0,pau:0};const d=Date.now()-s.since;return{act:s.act+(s.run?d:0),pau:s.pau+(s.run?0:d)}}
function flush(){const s=S.session;if(!s||!s.run)return;const n=Date.now(),d=n-s.since,g=goal(S.activeId);s.act+=d;if(g)g.ms=(g.ms||0)+d;s.since=n}
function ds(k){const d=S.days[k]||{},t=k===dk()&&S.session,l=t?live():{act:0,pau:0};
  return{ms:(d.ms||0)+l.act,pau:(d.pauseMs||0)+l.pau,items:d.items||0,pts:(d.pts||0)+Math.floor(l.act/60000),pauses:(d.pauses||0)+(t?S.session.pauses:0),best:Math.max(d.best||0,t?S.session.best:0)}}
const focus=x=>x.ms+x.pau>0?Math.round(x.ms/(x.ms+x.pau)*100):null;
function allKeys(){const a=Object.keys(S.days);if(!a.includes(dk()))a.push(dk());return a}
function totalPts(){return allKeys().reduce((n,k)=>n+ds(k).pts,0)}
function streak(){let n=0;const d=new Date();for(let i=0;i<400;i++){const x=ds(dk(d));if(x.ms>0||x.items>0)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}

const TITLES=["见习生","初学者","修行者","熟练者","达人","师范","名人","仙人","宗师","大贤者","传说"];
const lvOf=t=>Math.floor(Math.sqrt(t/40))+1;
const RP=[0,20,40,80,150],RN=["","铜","银","金","钻"];
const newSt=()=>({crit:0,combo:0,gd:0,night:0,early:0,back:0,qd:0});
const ST=()=>S.flags.st||newSt(),stw=()=>S.flags.st||(S.flags.st=newSt());
let combo=0,lastInc=0,pendC=[];
const sumD=f=>allKeys().reduce((n,k)=>n+f(ds(k)),0),maxD=f=>Math.max(0,...allKeys().map(k=>f(ds(k))));
const IT=()=>sumD(x=>x.items),MN=()=>sumD(x=>x.ms)/60000;
const P=(id,n,d,e,r,cur,max)=>({id,n,d,e,r,p:()=>[Math.min(max,Math.floor(cur())),max],f:()=>cur()>=max});
const Bf=(id,n,d,e,r,f)=>({id,n,d,e,r,f});
const BADGES=[
P("first","初次出击","完成第 1 个项目","🎯",1,IT,1),
P("i10","小试牛刀","累计完成 10 个项目","📘",1,IT,10),
P("i50","积少成多","累计完成 50 个项目","📚",2,IT,50),
P("i200","词海行舟","累计完成 200 个项目","🌊",3,IT,200),
P("i500","百炼成钢","累计完成 500 个项目","⚔️",4,IT,500),
P("block","二十五分钟","连续专注 25 分钟不暂停","🍅",1,()=>maxD(x=>x.best)/60000,25),
P("long","深度沉浸","连续专注 60 分钟不暂停","🧘",3,()=>maxD(x=>x.best)/60000,60),
P("m60","第一个小时","累计专注 1 小时","⏱️",1,MN,60),
P("m600","十小时修行","累计专注 10 小时","🏯",3,MN,600),
P("m3000","五十小时","累计专注 50 小时","🗻",4,MN,3000),
P("p100","百分日","单日积分达到 100","💯",1,()=>maxD(x=>x.pts),100),
P("p300","三百分日","单日积分达到 300","🚀",3,()=>maxD(x=>x.pts),300),
P("streak","三日连击","连续 3 天学习","🔥",1,streak,3),
P("s7","七日不断","连续 7 天学习","🌟",2,streak,7),
P("s14","两周坚持","连续 14 天学习","💎",3,streak,14),
P("s30","三十日传说","连续 30 天学习","🏆",4,streak,30),
Bf("goal","目标达成","完成一个学习目标","🏁",1,()=>!!S.flags.goal),
P("g3","三冠王","累计完成 3 个学习目标","👑",3,()=>ST().gd,3),
Bf("calm","心如止水","一次学习专注度 90% 以上（至少 10 分钟）","🌸",2,()=>!!S.flags.calm),
P("combo","连击高手","2 分钟内连续完成 5 项","⚡",2,()=>ST().combo,5),
P("crit","幸运之星","触发 3 次幸运暴击","🍀",2,()=>ST().crit,3),
P("night","夜猫子","22 点后学习满 5 分钟","🦉",1,()=>ST().night,1),
P("early","早起鸟","5–8 点学习满 5 分钟","🌅",1,()=>ST().early,1),
P("back","王者归来","中断 3 天以上后重新开始","🔙",2,()=>ST().back,1),
P("q1","任务达人","一天内完成全部 3 个任务","📜",1,()=>ST().qd,1),
P("q7","七日全勤","累计 7 天完成全部任务","🎁",3,()=>ST().qd,7),
P("lv5","修行有成","升到 Lv.5","🥋",2,()=>lvOf(totalPts()),5),
P("lv10","一代宗师","升到 Lv.10","🐉",4,()=>lvOf(totalPts()),10)];

/* ---- 每日任务：按日期固定抽 3 个，每个 +15，全部完成开宝箱 ---- */
const POOL=[
{id:"i5",t:"完成 5 个项目",g:5,f:x=>x.items},
{id:"i10",t:"完成 10 个项目",g:10,f:x=>x.items},
{id:"m25",t:"今日专注 25 分钟",g:25,f:x=>Math.floor(x.ms/60000)},
{id:"m45",t:"今日专注 45 分钟",g:45,f:x=>Math.floor(x.ms/60000)},
{id:"b25",t:"连续专注 25 分钟不暂停",g:25,f:x=>Math.floor(x.best/60000)},
{id:"f90",t:"一次专注度 90% 以上（≥10 分钟）",g:1,f:x=>x.ms>=600000&&focus(x)>=90?1:0},
{id:"p60",t:"今日积分达到 60",g:60,f:x=>x.pts},
{id:"s2",t:"完成 2 次学习（点结束）",g:2,f:()=>(S.days[dk()]||{}).sessions||0}];
function todayQuests(){let h=[...dk()].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const r=[];while(r.length<3){h=(h*69069+1)>>>0;const q=POOL[(h>>>8)%POOL.length];if(!r.includes(q))r.push(q)}return r}
function checkQuests(){const t=dk(),Q=S.flags.q&&S.flags.q.d===t?S.flags.q:(S.flags.q={d:t,c:[],box:0}),x=ds(t),m=[];let box=false;
  todayQuests().forEach(q=>{if(!Q.c.includes(q.id)&&q.f(x)>=q.g){Q.c.push(q.id);day(t).pts+=15;m.push("任务「"+q.t+"」+15")}});
  if(Q.c.length>=3&&!Q.box){Q.box=1;const r=20+Math.floor(Math.random()*61);day(t).pts+=r;stw().qd++;m.push("🎁 宝箱 +"+r);box=true}
  return{msgs:m,box}}
function questsHTML(){const t=dk(),Q=S.flags.q&&S.flags.q.d===t?S.flags.q:{c:[],box:0},x=ds(t);
  return `<section class="sec"><h2>今日任务<small>每个 +15 · 全部完成开宝箱 🎁${Q.box?" ✓":""}</small></h2>${todayQuests().map(q=>{const v=Math.min(q.g,q.f(x)),ok=Q.c.includes(q.id);
  return `<div class="qs${ok?" ok":""}"><span class="qi">${ok?"✅":"🎯"}</span><span class="qt"><b>${q.t}</b><div class="bar"><i style="width:${v/q.g*100}%"></i></div></span><small>${v}/${q.g}</small></div>`}).join("")}</section>`}

/* ---- 热力图 / 成就墙 ---- */
function heatHTML(){const c=[];for(let i=34;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d),x=ds(k),m=x.ms/60000,l=m>0?(m<15?1:m<30?2:m<60?3:4):(x.items>0?1:0);
  c.push(`<i class="l${l}${i?"":" td"}" title="${k}：${Math.round(m)} 分钟"></i>`)}
  return `<section class="sec"><h2>学习热力图<small>近 5 周 · 越绿学得越多</small></h2><div class="heat">${c.join("")}</div></section>`}
function badgesHTML(){const n=BADGES.filter(b=>S.badges[b.id]).length;
  return `<section class="sec"><h2>成就奖励<small>${n}/${BADGES.length} · 铜 20 · 银 40 · 金 80 · 钻 150 分</small></h2><div class="badges">${BADGES.map(b=>{const got=S.badges[b.id],pr=!got&&b.p?b.p():null;
  return `<div class="bd r${b.r} ${got?"got":"lock"}"><span class="ic">${b.e}</span><span class="tx"><b>${b.n} <em class="rt">${RN[b.r]}</em></b><small>${b.d}</small>${pr?`<div class="pg"><i style="width:${pr[0]/pr[1]*100}%"></i></div><small class="when">${pr[0]}/${pr[1]}</small>`:""}${got?`<small class="when">${esc(String(got).slice(5))} 解锁 · +${RP[b.r]}</small>`:""}</span></div>`}).join("")}</div></section>`}

/* ---- 音效 / 震动 / 庆祝弹窗 ---- */
const muted=()=>{try{return localStorage.getItem("jp-mute")==="1"}catch(e){return false}};
function sfx(f){if(muted())return;try{const a=sfx.c||(sfx.c=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch(e){}}
function fx(f){if(!muted()){try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}}sfx(f||660)}
function celebrate(e,title,sub){
  if($("#veil").classList.contains("on")){pendC.push([e,title,sub]);return}
  fx(880);const em="🎉✨🌸⭐🎊".match(/./gu);
  const c=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.7}s;font-size:${14+Math.random()*14}px">${em[Math.floor(Math.random()*em.length)]}</i>`).join("");
  $("#card").innerHTML=`<div class="conf">${c}</div><div class="big">${e}</div><h2>${esc(title)}</h2><p class="note" style="margin:6px 0 0">${esc(sub).replace(/\n/g,"<br>")}</p><button class="btn block" id="close">太棒了</button>`;
  $("#card").classList.add("cele");$("#veil").classList.add("on")}
const mb=$("#mute"),um=()=>{mb.textContent=muted()?"🔕":"🔔"};um();
mb.onclick=()=>{try{localStorage.setItem("jp-mute",muted()?"0":"1")}catch(e){}um();fx(660)};

/* ---- 统计追踪 ---- */
function trackSession(s){if(s.act<300000)return;const h=new Date().getHours(),st=stw();if(h>=22||h<4)st.night++;if(h>=5&&h<8)st.early++}
function backCheck(){const t=dk(),ks=Object.keys(S.days).filter(k=>k<t&&(S.days[k].ms>0||S.days[k].items>0)).sort();if(!ks.length)return;
  if((new Date(t+"T00:00:00")-new Date(ks[ks.length-1]+"T00:00:00"))/864e5>=3)stw().back=1}
function checkBadges(){const g=[],q=checkQuests();
  BADGES.forEach(b=>{if(!S.badges[b.id]&&b.f()){S.badges[b.id]=dk();day(dk()).pts+=RP[b.r];g.push(b)}});
  const L=lvOf(totalPts()),old=S.flags.lv,up=old&&L>old,lines=[];S.flags.lv=L;
  if(g.length)lines.push("成就："+g.map(b=>b.n).join("、")+" +"+g.reduce((n,b)=>n+RP[b.r],0));
  if(up)lines.push("升到 Lv."+L+"「"+TITLES[Math.min(L-1,TITLES.length-1)]+"」");
  lines.push(...q.msgs);
  if(g.length||up||q.box)celebrate(g.length?g.map(b=>b.e).join(""):up?"⬆️":"🎁",g.length?"解锁成就！":up?"升级了！":"今日任务全部完成！",lines.join("\n"));
  else if(lines.length)toast(lines.join(" · "));
  if(lines.length){save();render()}}

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2400)}

/* ---- actions ---- */
function addGoal(){const name=$("#gname").value.trim(),total=parseInt($("#gtotal").value,10);
  if(!name||!(total>=1)){toast("请填写目标名称和项目数");return}
  const g={id:Date.now().toString(36),name,total:Math.min(total,999),done:0,ms:0};S.goals.push(g);if(!S.activeId)S.activeId=g.id;
  $("#gname").value="";$("#gtotal").value="";save();render()}
function inc(g){if(g.done>=g.total)return;g.done++;const d=day(dk()),st=stw(),n=Date.now(),pt=[];
  combo=n-lastInc<120000?combo+1:1;lastInc=n;st.combo=Math.max(st.combo,combo);
  let add=10;const cb=combo>=3?Math.min(combo-2,5):0;if(cb){add+=cb;pt.push("连击 ×"+combo+" +"+cb)}
  if(Math.random()<.12){add+=10;st.crit++;pt.push("🍀 暴击 +10")}
  d.pts+=add;d.items++;if(S.session)S.session.items++;fx(500+Math.min(combo,8)*50);
  if(g.done>=g.total){d.pts+=50;st.gd++;S.flags.goal=1;toast("🏁 目标「"+g.name+"」达成！ +"+(add+50)+" 分")}else toast("+"+add+" 分"+(pt.length?" · "+pt.join(" · "):""));
  checkBadges();save();render()}
function undo(g){if(g.done<=0)return;const d=day(dk());g.done--;d.items=Math.max(0,d.items-1);d.pts=Math.max(0,d.pts-10);save();render()}
function del(g){if(pendDel!==g.id){pendDel=g.id;renderGoals();setTimeout(()=>{if(pendDel===g.id){pendDel=null;renderGoals()}},3000);return}
  flush();S.goals=S.goals.filter(x=>x!==g);if(S.activeId===g.id)S.activeId=S.goals[0]?S.goals[0].id:null;pendDel=null;save();render()}
function pick(g){flush();S.activeId=g.id;save();render()}
function toggle(){
  if(!goal(S.activeId)){toast("先添加并选择一个学习目标");return}
  const n=Date.now();let s=S.session;
  if(!s)backCheck(),S.session={run:true,since:n,act:0,pau:0,pauses:0,items:0,best:0,blockStart:n,blockAwarded:0,startDay:dk()};
  else if(s.run){flush();s.run=false;s.since=n;s.pauses++;s.blockStart=null;s.blockAwarded=0}
  else{s.pau+=n-s.since;s.run=true;s.since=n;s.blockStart=n;s.blockAwarded=0}
  save();render()}
function endSession(){const s=S.session;if(!s)return;
  if(s.run)flush();else s.pau+=Date.now()-s.since;
  const d=day(s.startDay),m=Math.floor(s.act/60000),f=s.act+s.pau>0?Math.round(s.act/(s.act+s.pau)*100):0;
  d.ms+=s.act;d.pauseMs+=s.pau;d.sessions++;d.pauses+=s.pauses;d.best=Math.max(d.best,s.best);d.pts+=m;
  if(f>=90&&s.act>=600000)S.flags.calm=1;
  S.session=null;trackSession(s);save();render();
  const msg=s.act<60000?"这次时间太短，先坐稳再开始。":f>=90?"专注度极高，几乎没有被打断。":f>=70?"不错，再减少几次暂停会更稳。":"暂停偏多。下次把单次学习缩短到 15 分钟，完成后再休息。";
  $("#card").innerHTML=`<h2>本次学习结束</h2><div class="grid">
  <div class="cell"><b>${minsH(s.act)}</b><small>专注时长</small></div>
  <div class="cell"><b>${u(f,"%")}</b><small>专注度</small></div>
  <div class="cell"><b>${s.pauses}</b><small>暂停次数</small></div>
  <div class="cell"><b>${s.items}</b><small>完成项目</small></div>
  <div class="cell"><b>${u(Math.floor(s.best/60000),"分")}</b><small>最长连续</small></div>
  <div class="cell"><b>+${m+s.items*10}</b><small>本次积分</small></div></div>
  <p class="note" style="margin-top:0">${msg}</p><button class="btn block" id="close">关闭</button>`;
  $("#card").classList.remove("cele");$("#veil").classList.add("on");checkBadges()}

/* ---- render ---- */
const ICON_STAR='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const ICON_LOCK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function renderGoals(){
  $("#goals").innerHTML=S.goals.length?S.goals.map(g=>{
    const p=Math.min(100,Math.round(g.done/g.total*100)),fin=g.done>=g.total,on=g.id===S.activeId;
    return `<article class="goal${on?" on":""}" data-id="${g.id}">
    <header><button class="pick" data-a="pick" aria-pressed="${on}"><span class="dot"></span><span class="nm">${esc(g.name)}</span></button><span class="cnt">${fin?'<em class="done">✓ 已达成</em>':""}${g.done}<i>/${g.total}</i></span></header>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div>
    <footer><span class="meta">${on?'<em class="chip">计时目标</em>':""}累计 ${Math.floor((g.ms||0)/60000)} 分钟</span>
    <button class="ghost" data-a="undo" ${g.done?"":"disabled"}>撤销</button>
    <button class="ghost${pendDel===g.id?" warn":""}" data-a="del">${pendDel===g.id?"再点确认删除":"删除"}</button></footer>
    ${fin?"":'<button class="tap" data-a="inc">完成一项　+10 分</button>'}</article>`}).join(""):
    `<p class="empty">先添加一个目标，例如「N3 单词」共 30 个项目。<br>完成一个就点一下，进度和积分会自动增加。</p>`}

function renderDash(){
  const t=dk(),x=ds(t),f=focus(x),tot=totalPts(),lv=Math.floor(Math.sqrt(tot/40))+1,base=40*(lv-1)**2,next=40*lv*lv;
  const titles=TITLES;
  const pct=Math.round(Math.min(100,(tot-base)/(next-base)*100));
  $("#hud").innerHTML=`<div class="lv"><span><small>LEVEL</small><b>${lv}</b></span></div>
  <div class="xp"><b>${titles[Math.min(lv-1,titles.length-1)]}</b><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><small>距下一级还差 ${next-tot} 分</small></div>
  <div class="pts"><b>${x.pts}</b><small>今日积分</small><small class="fl">🔥 ${streak()} 天连击</small></div>`;

  const wk=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);wk.push({k:dk(d),w:"日一二三四五六"[d.getDay()]})}
  const mx=Math.max(30,...wk.map(o=>ds(o.k).ms/60000)),fs=wk.map(o=>focus(ds(o.k))).filter(v=>v!==null),avg=fs.length?Math.round(fs.reduce((a,b)=>a+b,0)/fs.length):null;
  const tip=avg===null?"开始第一次计时后，这里会显示每天的专注度。":avg>=85?"近七天专注度 "+avg+"%，状态很稳。":avg>=65?"近七天专注度 "+avg+"%，暂停略多，试试缩短单次时长。":"近七天专注度 "+avg+"%，容易被打断。每次只设 15 分钟的小目标。";

  const rows=allKeys().map(k=>({k,...ds(k)})).filter(r=>r.pts>0).sort((a,b)=>b.pts-a.pts||b.k.localeCompare(a.k));
  const idx=rows.findIndex(r=>r.k===t),lab=k=>k===t?"今天":k.slice(5);
  const li=r=>`<li class="${r.k===t?"me":""}"><span class="no">${rows.indexOf(r)+1}</span><span class="d"><b>${lab(r.k)}</b><small>${mins(r.ms)} · 专注度 ${focus(r)===null?"—":focus(r)+"%"} · ${r.items} 项</small></span><span class="p">${r.pts}<i>分</i></span></li>`;
  let list=rows.slice(0,7).map(li).join("");if(idx>=7)list+=li(rows[idx]);
  const head=!rows.length?"完成第一个项目，榜单就开始了。":idx===0?(rows.length>1?"今天是历史最高分，继续保持。":"今天暂列第 1。"):idx<0?"今天还没有积分，点一下完成项目就能上榜。":`今天排第 ${idx+1} 名，再得 ${rows[0].pts-rows[idx].pts+1} 分就能刷新最高纪录。`;

  $("#dash").innerHTML=`<section class="sec"><h2>今日数据</h2><div class="grid">
  <div class="cell"><b>${minsH(x.ms)}</b><small>专注时长</small></div>
  <div class="cell"><b>${f===null?"—":u(f,"%")}</b><small>专注度</small></div>
  <div class="cell"><b>${x.items}</b><small>完成项目</small></div>
  <div class="cell"><b>${x.pauses}</b><small>暂停次数</small></div>
  <div class="cell"><b>${u(Math.floor(x.best/60000),"分")}</b><small>最长连续</small></div>
  <div class="cell"><b>${u(streak(),"天")}</b><small>连续学习</small></div></div></section>

  <section class="sec"><h2>近七天专注时长<small>柱：分钟 · 底部：专注度</small></h2><div class="week">${wk.map(o=>{
    const v=ds(o.k),m=v.ms/60000,h=m>0?Math.max(6,Math.round(m/mx*100)):0,fc=focus(v),td=o.k===t;
    return `<div class="col${td?" today":""}" title="${o.k}：${Math.round(m)} 分钟${fc===null?"":"，专注度 "+fc+"%"}"><span class="v">${m>0?Math.round(m):""}</span><div class="t"><div class="b" style="height:${h}%"></div></div><span class="w">${td?"今天":"周"+o.w}</span><span class="f">${fc===null?"":fc+"%"}</span></div>`}).join("")}</div>
  <p class="note">${tip}</p></section>
  ${heatHTML()}

  <section class="sec"><h2>每日成就排行榜</h2><p class="note" style="margin:0 0 10px">${head}</p>${list?`<ol class="rank">${list}</ol>`:""}</section>

  `;
  $("#quests").innerHTML=questsHTML();$("#bdg").innerHTML=badgesHTML();
  $("#bc").textContent=BADGES.filter(b=>S.badges[b.id]).length+"/"+BADGES.length}

function renderBar(){
  const s=S.session,l=live(),g=goal(S.activeId);
  $("#clk").textContent=clock(l.act);
  $("#sub").textContent=!s?(g?"目标：" + g.name:"选择目标后点击开始"):(s.run?"计时中":"已暂停")+" · "+(g?g.name:"");
  const b=$("#go");b.textContent=!s?"开始":s.run?"暂停":"继续";b.classList.toggle("run",!!(s&&s.run));
  $("#end").hidden=!s;const mn=$("#mini");mn.hidden=!(s&&TAB!=="focus");if(s)mn.textContent=(s.run?"⏱ ":"⏸ ")+clock(l.act)+(g?" · "+g.name:"");
  const bl=s&&s.run?Math.min(1,(Date.now()-s.blockStart)/BLOCK):0;$("#strip").style.width=(bl*100)+"%";$("#ring").style.strokeDashoffset=339.3*(1-bl);
  /* 标签页标题显示计时，PC 上切到别的标签也能看到 */
  document.title=s&&s.run?clock(l.act)+" · "+APP_TITLE:APP_TITLE}

function render(){renderGoals();renderDash();renderBar()}

/* ---- tabs ---- */
let TAB="focus";
function setTab(t){TAB=t;document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+t);
  document.querySelectorAll(".tabs button").forEach(b=>{const on=b.dataset.t===t;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
  scrollTo(0,0);renderBar()}
$(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b)setTab(b.dataset.t)};
$("#mini").onclick=()=>setTab("focus");

/* ---- events ---- */
$("#gform").onsubmit=e=>{e.preventDefault();addGoal()};
$("#goals").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const g=goal(b.closest(".goal").dataset.id);if(!g)return;
  ({pick,inc,undo,del})[b.dataset.a](g)};
$("#go").onclick=toggle;
$("#end").onclick=endSession;
$("#veil").onclick=e=>{if(lock)return;if(e.target.id==="veil"||e.target.id==="close")unmodal()};
/* 键盘：空格 开始/暂停，Esc 关闭弹窗（仅电脑端有意义） */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!lock&&$("#veil").classList.contains("on")){unmodal();return}
  if(e.code==="Space"&&!e.repeat&&e.target instanceof Element&&!e.target.closest("input,button,textarea,select,a,[contenteditable]")&&!$("#veil").classList.contains("on")){e.preventDefault();toggle()}
});

setInterval(()=>{
  tickN++;const s=S.session;
  if(s&&s.run){const n=Date.now(),b=n-s.blockStart;s.best=Math.max(s.best,b);const a=Math.floor(b/BLOCK);
    if(a>s.blockAwarded){const add=a-s.blockAwarded;s.blockAwarded=a;day(dk()).pts+=20*add;toast("连续专注 25 分钟 +"+20*add+" 分");checkBadges();save();renderDash()}}
  renderBar();
  if(tickN%10===0){if(S.session)flush();checkBadges();renderDash()}
  if(tickN%60===0&&S.session&&loaded)save();
},1000);
render();
boot();
document.addEventListener("visibilitychange",()=>{
  if(!loaded)return;
  if(document.hidden){if(dirty.size||pushT||S.session)push(true)}
  else pull().catch(()=>setSync("同步失败"));
});
addEventListener("pagehide",()=>{if(loaded&&(dirty.size||pushT))push(true)});
</script>
</body>
</html>
