<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1430" media="(prefers-color-scheme: dark)">
<title>日语专注修行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F2B93B'/%3E%3Ctext x='32' y='47' font-size='40' font-weight='700' text-anchor='middle' fill='%233A2A00' font-family='sans-serif'%3E日%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#EEF1F8;--surface:#fff;--surface2:#F6F8FC;--ink:#16204A;--muted:#5C6690;--line:#D5DBEC;--track:#E3E8F5;
  --gold:#F2B93B;--goldink:#3A2A00;--pink:#D6456B;--pri:#243B8F;--priink:#fff;--ok:#2E8B6E;--ur:#8B5CF6;
  --shadow:0 1px 2px rgba(22,32,74,.05),0 8px 24px -12px rgba(22,32,74,.18);
  --r:16px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei","Hiragino Sans","Yu Gothic UI",sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1430;--surface:#18204A;--surface2:#131A3D;--ink:#EAEFFF;--muted:#9AA6D6;--line:#2A3566;--track:#232D5E;
  --pri:#6F8CFF;--priink:#0E1430;--ok:#52C9A2;--pink:#F27C9B;--ur:#B38BFF;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1430;--surface:#18204A;--surface2:#131A3D;--ink:#EAEFFF;--muted:#9AA6D6;--line:#2A3566;--track:#232D5E;
  --pri:#6F8CFF;--priink:#0E1430;--ok:#52C9A2;--pink:#F27C9B;--ur:#B38BFF;--shadow:none;color-scheme:dark}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-size:1.02rem;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
small{font-size:.82rem}
.note{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.sec+.sec{margin-top:24px}

/* ============ 页面骨架 ============ */
.app{max-width:680px;margin:0 auto;padding:0 16px calc(114px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:8px;padding:16px 0 12px;flex-wrap:wrap}
.logo{flex:none;width:38px;height:38px;border-radius:12px;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font-weight:800;font-size:1.25rem;line-height:1;box-shadow:0 4px 12px -4px rgba(242,185,59,.55)}
.top h1{flex:1;min-width:110px;font-size:1.22rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.koban-pill{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));color:var(--ink)}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync[data-s="wait"]::before{background:var(--gold)}
.sync[data-s="err"]::before{background:var(--pink)}
.icbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:28px;font-size:.86rem;padding:0;display:grid;place-items:center}

/* ============ 等级 HUD 卡 ============ */
.hud{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.lv{flex:none;width:54px;height:54px;border-radius:15px;background:var(--pri);color:var(--priink);display:grid;place-items:center;text-align:center;line-height:1}
.lv small{display:block;font-size:.55rem;letter-spacing:.1em;opacity:.82;margin-bottom:3px}
.lv b{font-size:1.45rem;font-weight:800}
.xp{flex:1;min-width:0}
.xp-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xp-top>b{font-weight:800}
.buff-tag{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--pink) 16%,var(--surface));color:var(--pink);border:1px solid color-mix(in srgb,var(--pink) 35%,transparent)}
.frenzy-tag{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--gold) 25%,var(--surface));color:var(--goldink)}
:root[data-theme="dark"] .frenzy-tag{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .frenzy-tag{color:var(--gold)}}
.xp small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin:5px 0 4px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F43);border-radius:6px;transition:width .4s}
.pts{flex:none;text-align:right}
.pts b{display:block;font-size:1.75rem;font-weight:800;line-height:1.1}
.pts small{color:var(--muted);display:block}
.pts .fl{color:var(--pink);font-weight:700;font-size:.78rem}

/* ============ 视图切换与底部标签栏 ============ */
.views{margin-top:16px}
.view{animation:vin .24s ease-out}.view[hidden]{display:none!important}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#v-focus,.focus-main{display:flex;flex-direction:column;gap:20px}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;max-width:500px;margin:0 auto;display:flex;gap:3px;padding:5px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 34px -14px rgba(22,32,74,.45)}
.tabs button{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:none;border-radius:18px;min-height:52px;padding:5px 2px;color:var(--muted);font-size:.72rem;font-weight:700;transition:background .2s,color .2s}
.tabs button.on{background:var(--pri);color:var(--priink)}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs small{font-size:.6rem;font-weight:600;opacity:.88;line-height:1}
.tabs .dot-red{position:absolute;top:6px;right:calc(50% - 14px);width:7px;height:7px;border-radius:50%;background:var(--pink)}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:10;border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:700;font-size:.88rem;
  padding:9px 18px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini[hidden]{display:none}

/* ============ 专注页：圆环计时器 + 伴学灵 + 白噪音 ============ */
.dock{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 18px 16px;box-shadow:var(--shadow);text-align:center}
.modes{display:inline-flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px;border:1px solid var(--line);margin-bottom:12px}
.modes button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700;color:var(--muted);transition:all .18s}
.modes button.on{background:var(--pri);color:var(--priink)}
.modes button:disabled{opacity:.45;cursor:not-allowed}
.pet-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.pet-av{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:1.35rem;transition:transform .15s}
.pet-av:active{transform:scale(1.16) rotate(-6deg)}
.pet-say{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-size:.8rem;color:var(--ink);max-width:250px;text-align:left;line-height:1.35}
.pet-say small{display:block;color:var(--muted);font-size:.7rem}
.ringw{position:relative;width:min(236px,64vw);aspect-ratio:1;margin:0 auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:7.5}
.ringw .rt{stroke:var(--track)}
.ringw .rp{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .8s linear}
.ringw .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16%}
.ringw .clock b{font-size:clamp(2rem,8.5vw,2.65rem);font-weight:800;line-height:1.1;letter-spacing:.01em}
.ringw .clock small{max-width:100%;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cyc-chip{margin-top:4px;font-size:.72rem;font-weight:700;color:var(--goldink);background:var(--gold);border-radius:999px;padding:1px 8px}
.cyc-chip[hidden]{display:none}
.dock .btns{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px}
.go{min-width:146px;min-height:52px;border:0;border-radius:999px;background:var(--pri);color:var(--priink);font-weight:800;font-size:1.08rem;padding:0 24px;transition:background .2s,transform .08s}
.go:active{transform:scale(.97)}
.go.run{background:var(--pink);color:#fff}
.endbtn{min-height:46px;padding:0 16px;border-radius:999px;background:none;border:1px solid var(--line);color:var(--muted);font-size:.9rem;font-weight:600}
.endbtn[hidden]{display:none}
.amb{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.amb button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:.76rem;color:var(--muted);font-weight:600}
.amb button.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);font-weight:700}
.kbd{display:none;margin:10px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}
.kbd kbd{font:inherit;font-size:.73rem;padding:1px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);color:var(--ink)}

/* ============ 每日日语金句卡 & 连击热度条 ============ */
.qcard{background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 9%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:12px}
.qcard .qbody{flex:1;min-width:0}
.qcard .qjp{font-size:1.08rem;font-weight:800;line-height:1.35}
.qcard .qrd{font-size:.8rem;color:var(--pri);font-weight:600;margin-top:1px}
.qcard .qcn{font-size:.86rem;color:var(--muted);margin-top:3px}
.qcard .qacts{display:flex;flex-direction:column;gap:6px;flex:none}
.qcard .qbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:.78rem;font-weight:700;color:var(--muted)}

.combo-bar{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),color-mix(in srgb,var(--pink) 16%,var(--surface)));border:1px solid var(--gold);border-radius:14px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.combo-bar[hidden]{display:none}
.combo-bar b{font-weight:800;font-size:.95rem;white-space:nowrap}
.combo-bar .ctrack{flex:1;height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.combo-bar .ctrack i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .25s linear}
.combo-bar small{font-weight:700;color:var(--pink);white-space:nowrap}

/* ============ 学习目标 ============ */
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.76rem;color:var(--muted);font-weight:600}
.goal{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);transition:border-color .2s}
.goal.on{border-color:var(--pri)}
.goal header{display:flex;align-items:center;gap:10px}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;min-height:36px;font-weight:700;font-size:1.02rem;text-align:left}
.pick .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);transition:border-color .2s,background .2s}
.goal.on .pick .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 4.5px,transparent 5.5px)}
.pick .nm{overflow-wrap:anywhere}
.cnt{flex:none;font-weight:800;font-size:1.08rem}
.cnt i{font-style:normal;font-weight:500;color:var(--muted);font-size:.88rem}
.cnt .done{font-style:normal;font-size:.72rem;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:999px;padding:2px 9px;margin-right:8px;vertical-align:2px}
.bar{height:10px;border-radius:6px;background:var(--track);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .35s}
.goal footer{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;color:var(--muted);font-size:.84rem}
.goal.gfin footer{margin-top:-2px}
.goal .meta{flex:1;min-width:0}
.chip{font-style:normal;font-size:.72rem;font-weight:700;color:var(--priink);background:var(--pri);border-radius:999px;padding:1px 8px;margin-right:6px;white-space:nowrap}
.ghost{background:none;border:0;border-radius:8px;color:var(--muted);padding:6px 10px;min-height:34px;font-size:.84rem}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.warn{color:var(--pink);font-weight:700}
.tap{width:100%;margin-top:6px;min-height:50px;border:0;border-radius:12px;background:var(--gold);color:var(--goldink);font-weight:800;font-size:1.02rem;transition:transform .08s,filter .15s}
.tap:active:not(:disabled){transform:scale(.98)}
.empty{color:var(--muted);margin:0 0 12px;padding:16px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;font-size:.94rem;text-wrap:balance}
.fold{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:11px 14px;margin:4px 0 12px;color:var(--muted);font-weight:700;font-size:.88rem;text-align:left}
.fold i{font-style:normal;transition:transform .2s}.fold[aria-expanded=true] i{transform:rotate(180deg)}
.goal.gm{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;margin-bottom:8px;border-width:1px;box-shadow:none}
.goal.gm .pick{font-size:.94rem;font-weight:600;min-height:32px}
.goal.gm .cnt{font-size:.94rem}.goal.gm .ghost{padding:4px 8px;min-height:32px}

/* 添加目标 */
.add{display:grid;grid-template-columns:112px 1fr;gap:8px;margin-top:6px}
.add .nm{grid-column:1/-1}
.field{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px;width:100%;min-width:0}
.field::placeholder{color:var(--muted);opacity:.75}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--pri);color:var(--priink);font-weight:700}
.btn:active{filter:brightness(.92)}
.btn.gold{background:var(--gold);color:var(--goldink)}
.btn.soft{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ 任务与周常 BOSS 讨伐 ============ */
.qs{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.qs.ok{border-color:var(--ok)}.qs .qi{font-size:1.25rem}.qs .qt{flex:1;min-width:0}.qs .qt .bar{margin:6px 0 0;height:8px}.qs small{flex:none;color:var(--muted);font-weight:600}
.boss{background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 11%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--pink) 40%,var(--line));border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.boss-hd{display:flex;align-items:center;gap:12px}
.boss-ic{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--pink) 18%,var(--surface));display:grid;place-items:center;font-size:1.65rem;flex:none}
.boss-info{flex:1;min-width:0}
.boss-info b{display:block;font-size:1rem}
.boss-info small{color:var(--muted)}
.hp-bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.hp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#FF7E5F);border-radius:999px;transition:width .4s}
.boss-ft{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

/* ============ 道场（闪电刷词与百人斩） ============ */
.dojo-wrap{display:flex;flex-direction:column;gap:18px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;color:var(--muted);transition:all .15s}
.pill.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.qbox{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow);text-align:center;position:relative}
.qbox-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:.84rem;color:var(--muted)}
.qtag{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.76rem}
.qstreak{font-weight:800;color:var(--pink)}
.qprompt{font-size:clamp(1.65rem,6.5vw,2.35rem);font-weight:800;line-height:1.28;margin:10px 0 6px;word-break:break-word}
.qsub{color:var(--muted);font-size:.9rem;min-height:1.4em}
.qtools{display:flex;justify-content:center;gap:8px;margin:10px 0 16px}
.qtools button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.qtools button.fav{color:var(--goldink);background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-color:var(--gold)}
:root[data-theme="dark"] .qtools button.fav{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .qtools button.fav{color:var(--gold)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{min-height:52px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:.98rem;text-align:left;display:flex;align-items:center;gap:10px;transition:transform .08s,border-color .15s,background .15s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:.76rem;color:var(--muted)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.opt.wrong{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 18%,var(--surface))}
.qfeed{margin-top:14px;min-height:1.5em;font-size:.9rem;font-weight:700}
.blitz-bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden;margin-bottom:14px}
.blitz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--pink));transition:width .2s linear}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cform .full{grid-column:1/-1}

/* ============ 神社（御神签 / 祈愿抽卡 / 伴学灵图鉴 / 授与所） ============ */
.shrine-grid{display:flex;flex-direction:column;gap:20px}
.kuji-card{background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 12%,var(--surface)),color-mix(in srgb,var(--gold) 12%,var(--surface)));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.kuji-res{display:flex;align-items:center;gap:14px;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kuji-stamp{flex:none;width:54px;height:54px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.25rem;letter-spacing:.04em}
.gacha-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);text-align:center}
.gacha-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.shop-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.shop-row,.gacha-btns{grid-template-columns:1fr}}
.shop-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rl{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.rl.lock{opacity:.52;filter:grayscale(.85)}
.rl.eq{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.rl .rar{position:absolute;top:8px;left:8px;font-size:.64rem;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--track);color:var(--muted)}
.rl.ur .rar{background:linear-gradient(135deg,#7AE0FF,#B38BFF);color:#140E2E}
.rl.ssr .rar{background:var(--gold);color:var(--goldink)}
.rl.sr .rar{background:#B9C2DA;color:#1d2540}
.rl .st{position:absolute;top:8px;right:8px;font-size:.68rem;font-weight:800;color:var(--gold)}
.rl .emi{font-size:2.1rem;line-height:1.2;margin-top:8px}
.rl b{font-size:.88rem;line-height:1.25}
.rl small{font-size:.73rem;color:var(--muted);line-height:1.3}
.rl .usebtn{margin-top:6px;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 8px;font-size:.74rem;font-weight:700}
.rl.eq .usebtn{background:var(--gold);color:var(--goldink);border-color:var(--gold)}

/* ============ 统计与热力图 ============ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.cell b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2;white-space:nowrap}
.cell b .u{font-size:.76rem;font-weight:600;color:var(--muted);margin:0 3px 0 2px}
.cell small{color:var(--muted)}

.week{--ch:112px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 10px;box-shadow:var(--shadow)}
.col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font-size:.74rem;color:var(--muted)}
.col .v{height:1.1em;line-height:1.1;font-weight:700;color:var(--ink)}
.col .t{width:100%;max-width:38px;height:var(--ch);background:var(--track);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.col .b{width:100%;background:var(--pri);border-radius:8px}
.col.today .b{background:var(--gold)}
.col.today .w{color:var(--ink);font-weight:700}
.col .f{height:1.1em;font-size:.68rem}

.heat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.heat-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px;margin:0 auto 6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px;margin:0 auto}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--track)}
.heat .future{opacity:.22}
.heat .l1{background:color-mix(in srgb,var(--ok) 30%,var(--track))}.heat .l2{background:color-mix(in srgb,var(--ok) 55%,var(--track))}
.heat .l3{background:color-mix(in srgb,var(--ok) 80%,var(--track))}.heat .l4{background:var(--ok)}
.heat .frz{background:color-mix(in srgb,#60A5FA 45%,var(--track))}
.heat .td{outline:2px solid var(--gold);outline-offset:1px}

/* 排行榜 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.rank li.me{border:2px solid var(--gold);padding:9px 13px}
.no{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--track);font-weight:800;font-size:.95rem}
.rank li:nth-child(1) .no{background:var(--gold);color:var(--goldink)}
.rank li:nth-child(2) .no{background:#B9C2DA;color:#1d2540}
.rank li:nth-child(3) .no{background:#D79B6B;color:#2c1500}
.rank .d{flex:1;min-width:0}
.rank .d b{font-weight:700}
.rank .d small{display:block;color:var(--muted)}
.rank .p{flex:none;font-size:1.25rem;font-weight:800}
.rank .p i{font-style:normal;font-size:.75rem;font-weight:600;color:var(--muted);margin-left:2px}

/* 成就 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bd{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.bd .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--track);font-size:1.25rem}
.bd .tx{min-width:0;flex:1}
.bd b{display:block;line-height:1.3}
.bd small{display:block;color:var(--muted);line-height:1.35}
.bd.lock b{color:var(--muted)}
.bd.lock .ic{filter:grayscale(1);opacity:.5}
.bd.got b{color:var(--pink)}
.bd.got.r1 .ic{background:#D79B6B}.bd.got.r2 .ic{background:#B9C2DA}.bd.got.r3 .ic{background:var(--gold)}
.bd.got.r4 .ic{background:linear-gradient(135deg,#7AE0FF,#B38BFF)}.bd.got.r4{border-color:#9C8CFF}
.bd .rt{font-style:normal;font-size:.66rem;font-weight:700;border-radius:999px;padding:0 7px;background:var(--track);color:var(--muted);vertical-align:2px}
.bd .pg{height:6px;border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden}.bd .pg i{display:block;height:100%;background:var(--pri)}
.bd .when{margin-top:2px;font-size:.72rem}

/* 飘字动效 / 提示条 / 弹窗 */
.pop{position:fixed;pointer-events:none;z-index:40;font-weight:900;font-size:1rem;color:var(--goldink);background:var(--gold);padding:3px 10px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.22);animation:popUp .95s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:translate(-50%,0) scale(.85)}40%{transform:translate(-50%,-22px) scale(1.06)}100%{opacity:0;transform:translate(-50%,-48px) scale(.96)}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.veil{position:fixed;inset:0;background:rgba(10,14,36,.62);display:none;align-items:flex-end;justify-content:center;z-index:25}
.veil.on{display:flex}
.card{background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:540px;max-height:90%;overflow:auto;animation:up .24s ease-out}
.card h2{margin:0 0 4px;font-size:1.28rem;font-weight:800;justify-content:center}
.card .grid{margin:14px 0}
.card.cele{position:relative;overflow:hidden;text-align:center}
.card .big{font-size:3.2rem;line-height:1.2;margin-top:6px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-30px;font-style:normal;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(460px) rotate(360deg);opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:360px){
  .app{padding-left:12px;padding-right:12px}
  .cell{padding:10px}.cell b{font-size:1.18rem}
  .tabs button{font-size:.68rem}
}
@media(min-width:640px){
  .veil{align-items:center;padding:16px}
  .card{border-radius:24px;max-width:460px;padding:24px}
}
@media(min-width:960px){
  .app{max-width:1160px;padding:0 32px 116px}
  .top{padding:24px 0 16px;gap:10px}
  .top h1{font-size:1.55rem}
  .hud{padding:16px 24px;gap:20px}
  .lv{width:62px;height:62px}.lv b{font-size:1.65rem}
  .pts b{font-size:2.15rem}
  .views{margin-top:22px}
  #v-focus{display:grid;grid-template-columns:390px minmax(0,1fr);gap:28px;align-items:start}
  #v-focus>.dock{position:sticky;top:20px;padding:24px 22px 20px}
  .kbd{display:block}
  #dash{display:grid;grid-template-columns:1fr 1fr;gap:26px 32px;align-items:start}
  #dash .sec{margin:0}
  .dojo-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;align-items:start}
  .shrine-top{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .cell{padding:15px 18px}.cell b{font-size:1.65rem}
  .week{--ch:156px;gap:10px;padding:18px 18px 14px}
  .toast{bottom:96px}
}
@media(min-width:1280px){.badges{grid-template-columns:repeat(3,1fr)}.relics{grid-template-columns:repeat(4,1fr)}}
@media(hover:hover){
  .tap:hover:not(:disabled),.btn:hover:not(:disabled),.go:hover{filter:brightness(1.07)}
  .ghost:hover:not(:disabled),.endbtn:hover,.opt:hover:not(:disabled),.pill:hover:not(.on),.presets button:hover{background:var(--track)}
  .goal:not(.on):hover{border-color:var(--muted)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo" aria-hidden="true">日</span>
    <h1>日语专注修行</h1>
    <button class="koban-pill" id="kobanBtn" title="前往神社祈愿">🪙 <span id="kb">0</span></button>
    <span class="sync" id="sync" data-s="wait" role="status" aria-live="polite">连接中…</span>
    <button class="icbtn" id="themeBtn" aria-label="切换主题" title="切换深浅色主题">🌓</button>
    <button class="icbtn" id="mute" aria-label="音效开关" title="音效与语音开关">🔔</button>
  </header>

  <section class="hud" id="hud" aria-label="等级与今日积分"></section>

  <div class="views">
    <!-- 1. 专注视图 -->
    <div class="view" id="v-focus">
      <section class="dock" aria-label="计时器">
        <div class="modes" id="modes" role="group" aria-label="专注周期">
          <button data-m="15">⚡ 15分</button>
          <button data-m="25" class="on">🍅 25分</button>
          <button data-m="45">🧘 45分</button>
        </div>
        <div class="pet-bar">
          <button class="pet-av" id="petAv" title="点我互动朗读日语鼓励">🦊</button>
          <div class="pet-say" id="petSay">今日も一緒に頑張ろう！<small>今天也一起加油吧！</small></div>
        </div>
        <div class="ringw">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rt" cx="60" cy="60" r="54"/><circle class="rp" id="ring" cx="60" cy="60" r="54"/></svg>
          <div class="clock">
            <b id="clk">00:00</b>
            <small id="sub">选择目标后点击开始</small>
            <span class="cyc-chip" id="cyc" hidden>🍅 ×1</span>
          </div>
        </div>
        <div class="btns">
          <button class="endbtn" id="end" hidden>结束结算</button>
          <button class="go" id="go">开始专注</button>
        </div>
        <div class="amb" id="amb" aria-label="环境白噪音">
          <button data-amb="off" class="on">🔇 静音</button>
          <button data-amb="rain">🌧️ 夜雨</button>
          <button data-amb="wave">🌊 海浪</button>
          <button data-amb="fire">🔥 围炉</button>
        </div>
        <p class="note" id="ringNote">圆环 = 25 分钟连续专注进度，满环自动奖 +20 分</p>
        <p class="kbd">按 <kbd>空格</kbd> 开始 / 暂停</p>
      </section>

      <div class="focus-main">
        <div class="qcard" id="qcard"></div>
        <div class="combo-bar" id="comboBar" hidden>
          <b id="comboTxt">⚡ 连击 ×2</b>
          <div class="ctrack"><i id="comboFill"></i></div>
          <small id="comboSec">120s</small>
        </div>

        <section class="goals-sec">
          <h2>学习目标<small>完成每项 +10 分 +5🪙 · 达成目标 +50 分</small></h2>
          <div class="presets" id="presets">
            <button type="button" data-n="📕 核心词汇背诵" data-t="25">+ 核心词汇 25</button>
            <button type="button" data-n="🎧 听力精听跟读" data-t="5">+ 听力精听 5</button>
            <button type="button" data-n="📘 语法句型造句" data-t="10">+ 语法造句 10</button>
            <button type="button" data-n="📖 读解真题精读" data-t="2">+ 读解真题 2</button>
          </div>
          <div id="goals"></div>
          <form class="add" id="gform" autocomplete="off">
            <input class="field nm" id="gname" placeholder="目标，例如：N2 单词第 3 单元" maxlength="36" aria-label="目标名称" enterkeyhint="next">
            <input class="field num" id="gtotal" type="number" inputmode="numeric" min="1" max="999" placeholder="项目数" aria-label="项目数" enterkeyhint="done">
            <button class="btn" id="gadd" type="submit">添加目标</button>
          </form>
        </section>

        <div id="quests"></div>
        <div id="boss"></div>
      </div>
    </div>

    <!-- 2. 道场视图 -->
    <div class="view" id="v-dojo" hidden>
      <div class="dojo-wrap">
        <div class="dojo-left">
          <section class="sec">
            <h2>言灵道场<small>键盘 1-4 秒选 · R 重播发音 · 答对加积分与小判</small></h2>
            <div class="pill-row" id="dojoModes" style="margin-bottom:10px">
              <button class="pill on" data-dm="zen">🧘 自在快刷（连击加成）</button>
              <button class="pill" data-dm="blitz">⚔️ 60秒百人斩</button>
            </div>
            <div class="pill-row" id="dojoDecks" style="margin-bottom:14px"></div>
            <div class="qbox" id="qbox"></div>
          </section>
        </div>
        <div class="dojo-right">
          <section class="sec">
            <h2>我的生词 / 错题本<small id="wbStat"></small></h2>
            <p class="note" style="margin:0 0 10px">道场答错会自动收录进错题池，在「错题/生词」题库中连续答对 3 次自动斩除毕业！你也可以把教材里的生词加进来反复刷：</p>
            <form class="cform" id="cform" autocomplete="off">
              <input class="field" id="cq" placeholder="日语词（如：曖昧）" maxlength="30" aria-label="日语词汇">
              <input class="field" id="cr" placeholder="假名读音（如：あいまい）" maxlength="40" aria-label="假名读音">
              <input class="field full" id="cm" placeholder="中文释义（如：含糊，模棱两可）" maxlength="50" aria-label="中文释义">
              <button class="btn full" type="submit">➕ 加入专属词库</button>
            </form>
            <div id="customList" style="margin-top:12px"></div>
          </section>
        </div>
      </div>
    </div>

    <!-- 3. 神社视图 -->
    <div class="view" id="v-shrine" hidden>
      <div class="shrine-grid" id="shrine"></div>
    </div>

    <!-- 4. 数据视图 -->
    <div class="view" id="v-stats" hidden><main id="dash"></main></div>

    <!-- 5. 成就视图 -->
    <div class="view" id="v-badges" hidden><div id="bdg"></div></div>
  </div>

  <nav class="tabs" aria-label="页面导航">
    <button data-t="focus" class="on" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>专注</button>
    <button data-t="dojo"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h6M9 11h4"/></svg>道场<small id="dc"></small></button>
    <button data-t="shrine"><svg viewBox="0 0 24 24"><path d="M3 7h18M5 11h14M7 7v14M17 7v14M12 3v8"/></svg>神社<span class="dot-red" id="shrineDot" hidden></span><small id="sc"></small></button>
    <button data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>数据</button>
    <button data-t="badges"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>成就<small id="bc"></small></button>
  </nav>
  <button class="mini" id="mini" hidden></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
const TOKEN_KEY="jp-focus-token",THEME_KEY="jp-theme",APP_TITLE="日语专注修行";
let S={goals:[],activeId:null,days:{},session:null,badges:{},flags:{}},pendDel=null,tickN=0,toastT=null;
let loaded=false,rev=0,pushT=null,pushing=false,again=false,lock=false;
const dirty=new Set();

/* ============ 精选日语名言与谚语 ============ */
const QUOTES=[
  ["継続は力なり","けいぞくはちからなり","坚持就是力量 · 每天微小的积累终成大器"],
  ["七転び八起き","ななころびやおき","百折不挠 · 跌倒七次就勇敢站起八次"],
  ["千里の道も一歩から","せんりのみちもいっぽから","千里之行，始于足下 · 现在就开始第一项吧"],
  ["塵も積もれば山となる","ちりもつもればやまとなる","聚沙成塔，积少成多 · 每一个单词都算数"],
  ["雨垂れ石を穿つ","あまだれいしをうがつ","水滴石穿 · 专注的力量能穿透一切难关"],
  ["習うより慣れろ","ならうよりなれろ","熟能生巧 · 光看语法书不如多读多刷几题"],
  ["石の上にも三年","いしのうえにもさんねん","功到自然成 · 冰冷的石头坐上三年也会变暖"],
  ["思い立ったが吉日","おもいたったがきちじつ","心动不如行动 · 决定努力的此刻就是最好吉日"],
  ["好きこそ物の上手なれ","すきこそもののじょうずなれ","热爱是最好的老师 · 享受日语的声音与韵律"],
  ["急がば回れ","いそがばまわれ","欲速则不达 · 扎实的假名与基础是最快的捷径"],
  ["鉄は熱いうちに打て","てつはあついうちにうて","趁热打铁 · 趁着连击手感火热再来一组"],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const wkKey=(d=new Date())=>{const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()+3-(t.getDay()+6)%7);const w1=new Date(t.getFullYear(),0,4);return t.getFullYear()+"-W"+pad(1+Math.round(((t-w1)/864e5-3+(w1.getDay()+6)%7)/7))};
const tok=()=>{try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return""}};

function applyTheme(t){
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const b=$("#themeBtn");if(b)b.textContent=t==="dark"?"🌙":t==="light"?"☀️":"🌓";
}
try{applyTheme(localStorage.getItem(THEME_KEY)||"")}catch(e){}
$("#themeBtn").onclick=()=>{
  let cur="";try{cur=localStorage.getItem(THEME_KEY)||""}catch(e){}
  const nxt=cur===""?"dark":cur==="dark"?"light":"";
  try{if(nxt)localStorage.setItem(THEME_KEY,nxt);else localStorage.removeItem(THEME_KEY)}catch(e){}
  applyTheme(nxt);toast(nxt==="dark"?"已切换至深色夜修模式":nxt==="light"?"已切换至浅色晨读模式":"已切换至跟随系统主题");
};

function api(method,body,keep){
  const h={"content-type":"application/json"},t=tok();
  if(t)h.Authorization="Bearer "+t;
  return fetch("/api/state",{method,headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keep});
}
function setSync(t){const el=$("#sync");if(!el)return;el.textContent=t;el.dataset.s=t==="已同步"?"ok":/失败|过大/.test(t)?"err":"wait"}
function modal(html,locked){lock=!!locked;$("#card").innerHTML=html;$("#veil").classList.add("on")}
function unmodal(){
  lock=false;$("#veil").classList.remove("on");$("#card").classList.remove("cele");
  if(pendC.length){const a=pendC.shift();setTimeout(()=>celebrate(...a),280)}
}
function save(){if(!loaded)return;setSync("待同步");clearTimeout(pushT);pushT=setTimeout(push,800)}

async function push(keep){
  if(!loaded)return;
  if(pushing){again=true;return}
  clearTimeout(pushT);pushT=null;pushing=true;
  if(S.session)flush();
  const ks=[...dirty];dirty.clear();
  const daysPayload=Object.fromEntries(ks.filter(k=>S.days[k]).map(k=>[k,S.days[k]]));
  const body={rev,goals:S.goals,activeId:S.activeId,session:S.session,badges:S.badges,flags:S.flags,days:daysPayload};
  setSync("同步中…");
  let ok=false;
  try{
    const r=await api("PUT",body,keep);
    if(r.status===409){pushing=false;again=false;await pull(true);toast("已载入其他设备的最新数据，请重做刚才的操作");return}
    if(r.status===401){pushing=false;again=false;ks.forEach(k=>dirty.add(k));askToken();return}
    if(r.status===413){pushing=false;again=false;setSync("数据过大");toast("自定义数据超出容量上限");return}
    if(!r.ok)throw new Error("http "+r.status);
    rev=(await r.json()).rev;setSync("已同步");ok=true;
  }catch(e){
    ks.forEach(k=>dirty.add(k));
    again=false;
    setSync("同步失败，10 秒后重试");
    pushT=setTimeout(push,10000);
  }
  pushing=false;
  if(ok&&again){again=false;push()}
}

function migrateAndRepair(){
  if(!S.flags||typeof S.flags!=="object")S.flags={};
  if(!S.badges||typeof S.badges!=="object")S.badges={};
  if(!Array.isArray(S.goals))S.goals=[];
  if(!S.days||typeof S.days!=="object")S.days={};
  /* 为已完成的历史目标补齐防刷分标记 */
  const gdIds=S.flags.gdIds||(S.flags.gdIds=[]);
  S.goals.forEach(g=>{if(g.done>=g.total&&!gdIds.includes(g.id))gdIds.push(g.id)});
  /* 老用户升级首次赠送欢迎小判，新用户赠送 100 起步小判 */
  if(typeof S.flags.koban!=="number"){
    const tp=totalPts();
    S.flags.koban=tp>0?Math.min(800,120+Math.floor(tp*.5)):100;
  }
  if(!S.flags.bag)S.flags.bag={kitsune:1};
  if(!S.flags.pet)S.flags.pet="kitsune";
  /* 后台/跨端恢复中的进行中会话：立刻补算连续时长与番茄奖励 */
  if(S.session&&S.session.run){
    syncBlock(Date.now(),true);
  }
  autoApplyStreakShield();
}

async function pull(force){
  if(!force&&(dirty.size||pushT))await push();
  const r=await api("GET");
  if(r.status===401){askToken();return false}
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();
  S=Object.assign({goals:[],days:{},activeId:null,session:null,badges:{},flags:{}},j.state);
  rev=j.rev;dirty.clear();loaded=true;
  migrateAndRepair();
  setSync("已同步");render();return true;
}

const goal=id=>S.goals.find(g=>g.id===id);
const clock=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+":"+pad(m):pad(m))+":"+pad(s)};
const mins=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+" 小时 "+(m%60)+" 分":m+" 分钟"};
const u=(n,unit)=>`${n}<span class="u">${unit}</span>`;
const minsH=ms=>{const m=Math.round(ms/60000);return m>=60?u(Math.floor(m/60),"时")+u(m%60,"分"):u(m,"分钟")};

function sesDay(s=S.session){return(s&&s.startDay)||dk()}
function live(){
  const s=S.session;if(!s)return{act:0,pau:0,best:0};
  const n=Date.now(),d=Math.max(0,n-s.since);
  const act=s.act+(s.run?d:0),pau=s.pau+(s.run?0:d);
  const curBlock=s.run&&s.blockStart?Math.max(0,n-s.blockStart):0;
  return{act,pau,best:Math.max(s.best||0,curBlock)};
}
function ds(k){
  const d=S.days[k]||{},t=S.session&&sesDay(S.session)===k,l=t?live():{act:0,pau:0,best:0};
  const focusRate=todayBuff()==="focus"?1.2:1;
  return{
    ms:(d.ms||0)+l.act,
    pau:(d.pauseMs||0)+l.pau,
    items:d.items||0,
    pts:(d.pts||0)+Math.floor(Math.floor(l.act/60000)*focusRate),
    pauses:(d.pauses||0)+(t?S.session.pauses:0),
    best:Math.max(d.best||0,l.best)
  };
}
const focus=x=>x.ms+x.pau>0?Math.round(x.ms/(x.ms+x.pau)*100):null;
function allKeys(){const a=Object.keys(S.days);const t=dk();if(!a.includes(t))a.push(t);if(S.session&&!a.includes(sesDay()))a.push(sesDay());return a}
function totalPts(){return allKeys().reduce((n,k)=>n+ds(k).pts,0)}

/* 连胜护盾自动守护与连续天数计算 */
function autoApplyStreakShield(){
  const sh=S.flags.shields||0;if(sh<=0)return;
  const frz=S.flags.frozen||(S.flags.frozen=[]);
  const missed=[];
  const d=new Date();d.setDate(d.getDate()-1);
  for(let i=1;i<=4;i++){
    const k=dk(d),x=ds(k);
    if(x.ms>0||x.items>0){
      if(missed.length>0&&missed.length<=sh){
        missed.forEach(mk=>{if(!frz.includes(mk))frz.push(mk)});
        S.flags.shields-=missed.length;
        if(frz.length>45)frz.splice(0,frz.length-45);
        save();
        setTimeout(()=>toast(`🛡️ 身代护符已自动发动！为你守护了连续学习火焰`),500);
      }
      break;
    }else if(!frz.includes(k)){
      missed.push(k);
      if(missed.length>sh)break;
    }
    d.setDate(d.getDate()-1);
  }
}
function streak(){
  let n=0;const d=new Date(),frz=S.flags.frozen||[];
  for(let i=0;i<400;i++){
    const k=dk(d),x=ds(k);
    if(x.ms>0||x.items>0)n++;
    else if(frz.includes(k)){/* 护符冻结日：桥接连击不断裂 */}
    else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

function relicBonusRate(){

function gainKoban(base){
  const mult=relicBonusRate()*(todayBuff()==="focus"?1.15:1);
  const v=Math.max(1,Math.round(base*mult));
  S.flags.koban=Math.max(0,(S.flags.koban||0)+v);
  return v;
}

/* 级联结算：任务 -> 宝箱 -> 积分成就 -> 升级 一次性干净触发 */
function checkBadges(){
  if(!loaded)return;
  const g=[],msgs=[];let box=false,changed=true,guard=0;
  const t=dk(),Q=S.flags.q&&S.flags.q.d===t?S.flags.q:(S.flags.q={d:t,c:[],box:0});
  while(changed&&guard++<8){
    changed=false;
    const x=ds(t);
    todayQuests().forEach(q=>{
      if(!Q.c.includes(q.id)&&q.f(x)>=q.g){
        Q.c.push(q.id);day(t).pts+=15;const kb=gainKoban(20);
        msgs.push(`任务「${q.t}」+15分 +${kb}🪙`);changed=true;
      }
    });
    if(Q.c.length>=3&&!Q.box){
      Q.box=1;const r=25+Math.floor(Math.random()*60),kb=gainKoban(80);
      day(t).pts+=r;stw().qd++;msgs.push(`🎁 每日全勤宝箱 +${r}分 +${kb}🪙`);box=true;changed=true;
    }
    BADGES.forEach(b=>{
      if(!S.badges[b.id]&&b.f()){
        S.badges[b.id]=t;day(t).pts+=RP[b.r];gainKoban(RP[b.r]);
        g.push(b);changed=true;
      }
    });
  }
  const L=lvOf(totalPts()),old=S.flags.lv,up=old&&L>old;
  S.flags.lv=L;
  const lines=[];
  if(g.length)lines.push("解锁成就："+g.map(b=>b.n).join("、")+" +"+g.reduce((n,b)=>n+RP[b.r],0)+"分");
  if(up){const kb=gainKoban(50);lines.push(`升至 Lv.${L}「${TITLES[Math.min(L-1,TITLES.length-1)]}」+${kb}🪙`)}
  lines.push(...msgs);
  if(g.length||up||box)celebrate(g.length?g.map(b=>b.e).join(""):up?"⬆️":"🎁",g.length?"解锁新成就！":up?"道场晋升！":"今日任务全达成！",lines.join("\n"));
  else if(lines.length)toast(lines.join(" · "));
  if(lines.length){save();render()}
}

/* ============ 音效 / 朗读 / 白噪音合成器（兼容 iOS/Safari 唤醒） ============ */
const muted=()=>{try{return localStorage.getItem("jp-mute")==="1"}catch(e){return false}};
function getAudioCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  const a=sfx.c||(sfx.c=new C());
  if(a.state==="suspended")a.resume().catch(()=>{});
  return a;
}
function sfx(f,dur=.26,type="triangle"){
  if(muted())return;
  try{
    const a=getAudioCtx();if(!a)return;
    const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(.065,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
function chord(freqs){if(muted())return;freqs.forEach((f,i)=>setTimeout(()=>sfx(f,.32,"sine"),i*55))}
function fx(f){if(!muted()){try{navigator.vibrate&&navigator.vibrate(16)}catch(e){}}sfx(f||660)}

function speakJP(text){
  if(muted()||!window.speechSynthesis||!text)return;
  try{
    const clean=String(text).replace(/（.*?）|\(.*?\)|〜/g,"").trim();
    if(!clean)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);
    u.lang="ja-JP";u.rate=0.95;
    const vs=speechSynthesis.getVoices();
    const jv=vs.find(v=>/ja[-_]JP/i.test(v.lang)&&/Kyoko|Otoya|Google|Haruka|Nanami/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang));
    if(jv)u.voice=jv;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* WebAudio 零外部资源白噪音（夜雨 / 海浪 / 围炉） */
let ambNode=null,ambMode="off";
function stopAmbient(){
  if(ambNode){try{ambNode.stop()}catch(e){}try{ambNode.disconnect()}catch(e){}if(ambNode._lfo)try{ambNode._lfo.stop()}catch(e){}ambNode=null}
}
function setAmbient(mode){
  ambMode=mode;stopAmbient();
  document.querySelectorAll("#amb button").forEach(b=>b.classList.toggle("on",b.dataset.amb===mode));
  if(mode==="off"||muted())return;
  try{
    const a=getAudioCtx();if(!a)return;
    const len=a.sampleRate*3,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){
      const w=Math.random()*2-1;
      b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;
      let sample=(b0+b1+b2+w*.1848)*.12;
      if(mode==="fire"&&Math.random()<.0018)sample+=(Math.random()*.7);
      ch[i]=sample;
    }
    const src=a.createBufferSource();src.buffer=buf;src.loop=true;
    const flt=a.createBiquadFilter();flt.type="lowpass";
    const gn=a.createGain();
    if(mode==="rain"){flt.frequency.value=1150;gn.gain.value=.08}
    else if(mode==="wave"){
      flt.frequency.value=480;gn.gain.value=.055;
      const lfo=a.createOscillator(),lfoG=a.createGain();
      lfo.frequency.value=.13;lfoG.gain.value=320;
      lfo.connect(lfoG);lfoG.connect(flt.frequency);lfo.start();src._lfo=lfo;
    }else{flt.frequency.value=340;gn.gain.value=.11}
    src.connect(flt);flt.connect(gn);gn.connect(a.destination);
    src.start();ambNode=src;
  }catch(e){}
}

/* ============ 专注计时与目标操作（彻底修复后台漏奖、撤销刷分、删除卡死） ============ */
let selCycleMin=25;
function trackTimeWindow(s){
  const act=s.act+(s.run?Math.max(0,Date.now()-s.since):0);
  if(act<300000)return;
  const hNow=new Date().getHours(),hStart=typeof s.startHour==="number"?s.startHour:hNow,st=stw();
  if(!s.nightDone&&(hNow>=22||hNow<4||hStart>=22||hStart<4)){st.night++;s.nightDone=1}
  if(!s.earlyDone&&((hNow>=5&&hNow<8)||(hStart>=5&&hStart<8))){st.early++;s.earlyDone=1}
}
function backCheck(){
  const t=dk(),ks=Object.keys(S.days).filter(k=>k<t&&(S.days[k].ms>0||S.days[k].items>0)).sort();
  if(!ks.length)return;
  if(Math.round((new Date(t+"T00:00:00")-new Date(ks[ks.length-1]+"T00:00:00"))/864e5)>=3)stw().back=1;
}
function syncBlock(n=Date.now(),silent=false){
  const s=S.session;if(!s||!s.run||!s.blockStart)return 0;
  const b=Math.max(0,n-s.blockStart);
  s.best=Math.max(s.best||0,b);
  const cMin=s.cycleMin||25,cMs=cMin*60000,a=Math.floor(b/cMs),prev=s.blockAwarded||0;
  if(a>prev){
    const addN=a-prev;s.blockAwarded=a;
    const per=cMin>=45?40:cMin>=25?20:10;
    const pts=per*addN,dKey=sesDay(s);
    day(dKey).pts+=pts;s.pts=(s.pts||0)+pts;
    const kb=gainKoban(pts);dealBoss(cMin*addN);
    if(!silent){chord([587,740,880]);toast(`🍅 连续专注 ${cMin*a} 分钟 +${pts}分 +${kb}🪙`)}
    return pts;
  }
  return 0;
}
function flush(){
  const s=S.session;if(!s||!s.run)return;
  const n=Date.now(),d=Math.max(0,n-s.since),g=goal(S.activeId);
  syncBlock(n);
  s.act+=d;if(g)g.ms=(g.ms||0)+d;s.since=n;
  trackTimeWindow(s);
}

function addGoal(presetName,presetTotal){
  const name=(presetName??$("#gname").value).trim(),total=parseInt(presetTotal??$("#gtotal").value,10);
  if(!name||!(total>=1)){toast("请填写目标名称和项目数");return}
  const g={id:Date.now().toString(36)+Math.random().toString(36).slice(2,4),name,total:Math.min(total,999),done:0,ms:0};
  S.goals.push(g);
  const curG=goal(S.activeId);
  if(!S.activeId||(!S.session&&curG&&curG.done>=curG.total))S.activeId=g.id;
  if(!presetName){$("#gname").value="";$("#gtotal").value=""}
  fx(620);save();render();
}

function inc(g,btnEl){
  if(g.done>=g.total)return;
  backCheck();
  g.done++;
  const t=dk(),d=day(t),st=stw(),n=Date.now(),pt=[];
  combo=n-lastInc<120000?combo+1:1;lastInc=n;st.combo=Math.max(st.combo,combo);
  const maxCb=todayBuff()==="combo"?8:5;
  let add=Math.round(10*frenzyMult());
  const cb=combo>=3?Math.min(combo-2,maxCb):0;
  if(cb){add+=cb;pt.push(`连击×${combo} +${cb}`)}
  const critChance=todayBuff()==="crit"?.24:.12;
  if(Math.random()<critChance){add+=10;st.crit++;pt.push("🍀暴击 +10")}
  let goalBonus=0;
  const gdIds=S.flags.gdIds||(S.flags.gdIds=[]);
  if(g.done>=g.total&&!gdIds.includes(g.id)){
    gdIds.push(g.id);if(gdIds.length>200)gdIds.shift();
    goalBonus=50;st.gd++;S.flags.goal=1;
  }
  const totalAdd=add+goalBonus;
  const kb=gainKoban(5+(goalBonus?25:0)+(cb?2:0));
  d.pts+=totalAdd;d.items++;
  if(S.session){S.session.items++;S.session.pts=(S.session.pts||0)+totalAdd}
  /* 记录撤销栈，防止刷分与跨天误扣 */
  const uh=S.flags.uh||(S.flags.uh={});
  const arr=uh[g.id]||(uh[g.id]=[]);
  arr.push({d:t,pts:totalAdd,kb,ses:!!S.session});
  if(arr.length>15)arr.shift();

  dealBoss(10+(goalBonus?30:0));
  fx(520+Math.min(combo,10)*45);
  popText(btnEl,`+${totalAdd}分 +${kb}🪙`);
  if(g.done>=g.total){
    chord([523,659,784,1046]);
    toast(goalBonus?`🏁 目标「${g.name}」达成！+${totalAdd}分 +${kb}🪙`:`✓ 目标「${g.name}」再次完成！+${totalAdd}分`);
    setPetSay("すごい！目標達成おめでとう！","太棒啦！恭喜达成学习目标！");
  }else{
    toast(`+${totalAdd}分 +${kb}🪙`+(pt.length?" · "+pt.join(" · "):""));
    if(combo>=3)setPetSay(`${combo}コンボ！勢いに乗ってるね！`,`${combo} 连击！手感火热继续冲！`);
  }
  checkBadges();save();render();
}

function undo(g){
  if(g.done<=0)return;
  g.done--;
  const uh=S.flags.uh&&S.flags.uh[g.id],h=uh&&uh.length?uh.pop():null;
  if(h&&S.days[h.d]){
    const d=day(h.d);
    d.items=Math.max(0,d.items-1);
    d.pts=Math.max(0,d.pts-h.pts);
    S.flags.koban=Math.max(0,(S.flags.koban||0)-(h.kb||0));
    if(h.ses&&S.session){
      S.session.items=Math.max(0,S.session.items-1);
      S.session.pts=Math.max(0,(S.session.pts||0)-h.pts);
    }
  }else{
    /* 无历史栈的旧进度：仅当今日确有项目记录时才扣减今日 10 分，避免误扣其他积分 */
    const d=day(dk());
    if(d.items>0){d.items--;d.pts=Math.max(0,d.pts-10)}
  }
  toast("已撤销一项进度");save();render();
}

function del(g){
  if(pendDel!==g.id){pendDel=g.id;renderGoals();setTimeout(()=>{if(pendDel===g.id){pendDel=null;renderGoals()}},3000);return}
  flush();
  S.goals=S.goals.filter(x=>x!==g);
  if(S.flags.uh)delete S.flags.uh[g.id];
  if(S.activeId===g.id){
    const nextActive=S.goals.find(x=>x.done<x.total)||S.goals[0]||null;
    S.activeId=nextActive?nextActive.id:null;
  }
  pendDel=null;save();render();
}

function endSession(){
  const s=S.session;if(!s)return;
  if(s.run)flush();else s.pau+=Math.max(0,Date.now()-s.since);

  $("#card").innerHTML=`<h2>🍵 本次修行结算</h2><div class="grid">

/* ============ 言灵道场：闪电刷词与 60 秒百人斩 ============ */
let dojoMode="zen",dojoDeck="all",curQ=null,qAnswered=false,qStreak=0;
let blitzRun=false,blitzLeft=0,blitzScore=0,blitzTimer=null;

function allCards(){
  const custom=(S.flags.custom||[]).map((c,i)=>[c.q,c.r||c.q,c.m,"wb","c_"+i]);
  const base=BASE_DECK.map((c,i)=>[c[0],c[1],c[2],c[3],"b_"+i]);
  return [...custom,...base];
}
function wrongMap(){return S.flags.wrong||(S.flags.wrong={})}
function favSet(){return S.flags.favs||(S.flags.favs=[])}
function wbCards(){
  const wm=wrongMap(),fs=favSet();
  return allCards().filter(c=>c[3]==="wb"||wm[c[4]]>0||fs.includes(c[4]));
}
function filteredDeck(){
  if(dojoDeck==="wb")return wbCards();
  if(dojoDeck==="all")return allCards();
  return allCards().filter(c=>c[3]===dojoDeck);
}

function makeQuestion(){
  let pool=filteredDeck();
  if(pool.length<4){
    if(dojoDeck==="wb"){curQ=null;return}
    pool=allCards();
  }
  const item=pool[Math.floor(Math.random()*pool.length)];
  const [q,r,m,cat,key]=item;
  const hasReading=q!==r&&!/^接|^拟态/.test(r);
  /* 随机题型：0=看词选释义，1=看汉字选假名读音，2=看中文选日语词 */
  const roll=Math.random();
  const qType=hasReading&&roll<.42?1:(roll>.76?2:0);
  const full=allCards();
  const sameCat=full.filter(x=>x[3]===cat&&x[4]!==key);
  const distPool=(sameCat.length>=6?sameCat:full.filter(x=>x[4]!==key));
  const pick3=(proj,ans)=>{
    const s=[];const shuffled=[...distPool].sort(()=>Math.random()-.5);
    for(const x of shuffled){const v=proj(x);if(v&&v!==ans&&!s.includes(v)){s.push(v);if(s.length===3)break}}
    while(s.length<3){const v=proj(full[Math.floor(Math.random()*full.length)]);if(v&&v!==ans&&!s.includes(v))s.push(v)}
    return s;
  };
  let prompt,sub,ans,opts,speakTxt=q;
  if(qType===1){
    const pureR=r.replace(/（.*?）/g,"");
    prompt=q;sub="请选择正确的平假名读音";ans=pureR;
    opts=[ans,...pick3(x=>x[1].replace(/（.*?）/g,""),ans)];
  }else if(qType===2){
    prompt=m;sub="请选择对应的地道日语表达";ans=q;
    opts=[ans,...pick3(x=>x[0],ans)];
  }else{
    prompt=q;sub=hasReading&&dojoMode==="zen"?"请选择正确的中文释义":"请选择正确的释义";ans=m;
    opts=[ans,...pick3(x=>x[2],ans)];
  }
  opts.sort(()=>Math.random()-.5);
  curQ={item,key,q,r,m,prompt,sub,ans,opts,qType,speakTxt};
  qAnswered=false;
}

function startBlitz(){
  blitzRun=true;blitzLeft=60;blitzScore=0;qStreak=0;
  clearInterval(blitzTimer);
  makeQuestion();renderDojo();

}
function endBlitz(){
  clearInterval(blitzTimer);blitzTimer=null;blitzRun=false;
  const st=stw(),isRec=blitzScore>(st.qb60||0);
  st.qb60=Math.max(st.qb60||0,blitzScore);

}

function answerQuiz(idx,btnEl){
  if(!curQ||qAnswered)return;
  if(dojoMode==="blitz"&&!blitzRun)return;
  qAnswered=true;
  const chosen=curQ.opts[idx],ok=chosen===curQ.ans,wm=wrongMap();
  const buttons=document.querySelectorAll("#qbox .opt");
  buttons.forEach((b,i)=>{
    if(curQ.opts[i]===curQ.ans)b.classList.add("right");
    else if(i===idx&&!ok)b.classList.add("wrong");
    b.disabled=true;
  });
  speakJP(curQ.q);
  const feed=$("#qfeed");
  if(ok){
    qStreak++;stw().qok=(stw().qok||0)+1;
    addTodayQuizCount();
    /* 错题池答对减计数，3 次归零自动毕业 */
    if(wm[curQ.key]){wm[curQ.key]--;if(wm[curQ.key]<=0){delete wm[curQ.key];toast(`🎓「${curQ.q}」已彻底掌握，移出错题池！`)}}
    if(dojoMode==="blitz"){
      blitzScore++;
      let timeAdd="";
      if(qStreak%5===0){blitzLeft=Math.min(60,blitzLeft+3);timeAdd=" · ⏱+3s!"}
      fx(560+Math.min(qStreak,10)*40);
      if(feed)feed.innerHTML=`<span style="color:var(--ok)">⚡ 斩！${esc(curQ.q)}（${esc(curQ.r)}）：${esc(curQ.m)}${timeAdd}</span>`;
      setTimeout(()=>{if(blitzRun){makeQuestion();renderDojoQuestion()}},360);
    }else{
      const mult=(todayBuff()==="quiz"?1.35:1)*frenzyMult();
      const basePts=qStreak>=5?4:qStreak>=3?3:2;
      const pts=Math.max(2,Math.round(basePts*mult));
      const kb=gainKoban(2+(qStreak>=5?2:0));
      day(dk()).pts+=pts;dealBoss(3);
      fx(540+Math.min(qStreak,10)*40);
      popText(btnEl,`+${pts}分 +${kb}🪙`);
      if(feed)feed.innerHTML=`<span style="color:var(--ok)">✅ 正确！${esc(curQ.q)}【${esc(curQ.r)}】${esc(curQ.m)}（连击 ×${qStreak}）</span>`;
      save();checkBadges();renderHudOnly();
      setTimeout(()=>{makeQuestion();renderDojoQuestion()},780);
    }
  }else{
    qStreak=0;
    wm[curQ.key]=Math.min(5,(wm[curQ.key]||0)+3);
    const keys=Object.keys(wm);if(keys.length>120)delete wm[keys[0]];
    sfx(220,.35,"sawtooth");
    if(dojoMode==="blitz"){
      blitzLeft=Math.max(0,blitzLeft-2);
      if(feed)feed.innerHTML=`<span style="color:var(--pink)">❌ -2s！正解：${esc(curQ.q)}【${esc(curQ.r)}】${esc(curQ.m)}（已入错题本）</span>`;
      save();
      setTimeout(()=>{if(blitzRun){makeQuestion();renderDojoQuestion()}},900);
    }else{
      if(feed)feed.innerHTML=`<span style="color:var(--pink)">❌ 已收录错题本！${esc(curQ.q)}【${esc(curQ.r)}】${esc(curQ.m)}</span>`;
      save();renderDojoDecks();
      setTimeout(()=>{makeQuestion();renderDojoQuestion()},1500);
    }
  }
}

function rollOneRelic(minRarity=1){
  const r=Math.random();
  let rar=r<.05?4:r<.20?3:r<.52?2:1;
  if(rar<minRarity)rar=minRarity;
  const pool=RELICS.filter(x=>x.r===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}
function pullGacha(n){
  const cost=n===5?450:100;
  if((S.flags.koban||0)<cost){toast(`小判不足（需要 ${cost} 🪙，专注、完成目标或道场刷词即可获取）`);return}
  S.flags.koban-=cost;
  const bag=S.flags.bag||(S.flags.bag={}),got=[];
  for(let i=0;i<n;i++){
    const minR=(n===5&&i===4&&!got.some(x=>x.r.r>=2))?2:1;
    const rel=rollOneRelic(minR);
    const isNew=!bag[rel.id];
    bag[rel.id]=Math.min(5,(bag[rel.id]||0)+1);
    if(bag[rel.id]===5&&!isNew)S.flags.koban+=25; /* 满星溢出返还星砂小判 */
    got.push({r:rel,isNew,star:bag[rel.id]});
  }
  save();checkBadges();render();
  const lines=got.map(g=>`${g.r.e} [${RAR_NAME[g.r.r]}] ${g.r.n} ${g.isNew?"✨新解锁！":`★${g.star}`}`).join("\n");
  celebrate(got.map(g=>g.r.e).join(""),n===5?"五连祈愿降临！":"神社祈愿成功！",lines);
}

  const head=!rows.length?"完成第一个项目或道场刷词即可登上榜单！":idx===0?(rows.length>1?"🏆 今天已刷新历史最高分纪录！继续扩大优势！":"今天暂列历史第 1 名！"):idx<0?"今天尚未得分，完成一项或去道场刷几题立即上榜！":`今天排历史第 ${idx+1} 名，再得 ${rows[0].pts-rows[idx].pts+1} 分即可登顶历史第一！`;

  $("#dash").innerHTML=`<section class="sec"><h2>今日修行总览</h2><div class="grid">
  <div class="cell"><b>${minsH(x.ms)}</b><small>专注时长</small></div>
  <div class="cell"><b>${f===null?"—":u(f,"%")}</b><small>专注度</small></div>
  <div class="cell"><b>${x.items}</b><small>完成项目</small></div>
  <div class="cell"><b>${todayQuizCount()}</b><small>道场答对</small></div>
  <div class="cell"><b>${u(Math.floor(x.best/60000),"分")}</b><small>最长连续</small></div>
  <div class="cell"><b>${u(streak(),"天")}</b><small>连续学习</small></div></div></section>

  <section class="sec"><h2>近七天专注时长<small>柱：分钟 · 底部：专注度</small></h2><div class="week">${wk.map(o=>{
    const v=ds(o.k),m=v.ms/60000,h=m>0?Math.max(6,Math.round(m/mx*100)):0,fc=focus(v),td=o.k===t;
    return `<div class="col${td?" today":""}" title="${o.k}：${Math.round(m)} 分钟${fc===null?"":"，专注度 "+fc+"%"}"><span class="v">${m>0?Math.round(m):""}</span><div class="t"><div class="b" style="height:${h}%"></div></div><span class="w">${td?"今天":"周"+o.w}</span><span class="f">${fc===null?"":fc+"%"}</span></div>`;
  }).join("")}</div><p class="note">${tip}</p></section>
  ${heatHTML()}
  <section class="sec"><h2>每日高分殿堂</h2><p class="note" style="margin:0 0 10px">${head}</p>${list?`<ol class="rank">${list}</ol>`:""}</section>`;

  $("#quests").innerHTML=questsHTML();
  $("#boss").innerHTML=bossHTML();
  $("#bdg").innerHTML=badgesHTML();
  $("#bc").textContent=BADGES.filter(b=>S.badges[b.id]).length+"/"+BADGES.length;
}

function renderBar(){
  const s=S.session,l=live(),g=goal(S.activeId);
  const cMin=s?s.cycleMin||25:selCycleMin,cMs=cMin*60000,bonus=cMin>=45?40:cMin>=25?20:10;
  document.querySelectorAll("#modes button").forEach(b=>{
    b.classList.toggle("on",Number(b.dataset.m)===cMin);
    b.disabled=!!s;
  });
  $("#ringNote").textContent=`圆环 = ${cMin} 分钟连续专注进度，满环自动奖 +${bonus} 分（暂停会重置当前环）`;
  $("#clk").textContent=clock(l.act);
  $("#sub").textContent=!s?(g?"当前目标："+g.name:"选择目标后点击开始"):(s.run?"心流专注中":"已暂停")+(g?" · "+g.name:"");
  const b=$("#go");b.textContent=!s?"开始专注":s.run?"暂停":"继续专注";b.classList.toggle("run",!!(s&&s.run));
  $("#end").hidden=!s;
  const mn=$("#mini");mn.hidden=!(s&&TAB!=="focus");
  if(s)mn.textContent=(s.run?"⏱ ":"⏸ ")+clock(l.act)+(g?" · "+g.name:"");

  /* 修复圆环：超过单轮时长后按周期取模继续推进，并展示已完成轮数徽章 */
  const elapsed=s&&s.run&&s.blockStart?Math.max(0,Date.now()-s.blockStart):0;
  const cycles=Math.floor(elapsed/cMs),bl=s&&s.run?(elapsed%cMs)/cMs:0;
  $("#ring").style.strokeDashoffset=339.3*(1-bl);
  const cyc=$("#cyc");cyc.hidden=!(s&&s.run&&cycles>=1);
  if(cycles>=1)cyc.textContent=`🍅 ×${cycles}`;

  /* 连击热度倒计时条 */
  const cbLeft=combo>=2?Math.max(0,120000-(Date.now()-lastInc)):0;
  const cbar=$("#comboBar");
  if(cbLeft>0){
    cbar.hidden=false;
    $("#comboTxt").textContent=`⚡ 连击 ×${combo}`;
    $("#comboFill").style.width=(cbLeft/120000*100)+"%";
    $("#comboSec").textContent=Math.ceil(cbLeft/1000)+"s";
  }else cbar.hidden=true;

  document.title=s&&s.run?clock(l.act)+" · "+APP_TITLE:APP_TITLE;
}

function render(){renderPet();renderQuote();renderGoals();renderDash();renderShrine();renderDojo();renderBar()}

/* ============ 页面标签切换与事件绑定 ============ */
let TAB="focus";
function setTab(t){
  if(TAB==="dojo"&&t!=="dojo"&&blitzRun)endBlitz();
  TAB=t;
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+t);
  document.querySelectorAll(".tabs button").forEach(b=>{const on=b.dataset.t===t;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
  scrollTo(0,0);renderBar();
}
$(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b)setTab(b.dataset.t)};
$("#kobanBtn").onclick=()=>setTab("shrine");
$("#mini").onclick=()=>setTab("focus");

$("#modes").onclick=e=>{const b=e.target.closest("button[data-m]");if(!b||S.session)return;selCycleMin=Number(b.dataset.m);fx(560);renderBar()};
$("#amb").onclick=e=>{const b=e.target.closest("button[data-amb]");if(!b)return;setAmbient(b.dataset.amb)};
$("#presets").onclick=e=>{const b=e.target.closest("button[data-n]");if(!b)return;addGoal(b.dataset.n,b.dataset.t)};
$("#gform").onsubmit=e=>{e.preventDefault();addGoal()};
$("#goals").onclick=e=>{
  if(e.target.closest("[data-fold]")){FOLD=!FOLD;renderGoals();return}
  const b=e.target.closest("button[data-a]");if(!b)return;
  const g=goal(b.closest(".goal").dataset.id);if(!g)return;
  const act=b.dataset.a;
  if(act==="inc")inc(g,b);else({pick,undo,del})[act](g);
};
$("#go").onclick=toggle;
$("#end").onclick=endSession;
$("#veil").onclick=e=>{if(lock)return;if(e.target.id==="veil"||e.target.id==="close")unmodal()};

/* 道场与神社委托事件 */
$("#dojoModes").onclick=e=>{
  const b=e.target.closest("button[data-dm]");if(!b)return;
  if(blitzRun)endBlitz();
  dojoMode=b.dataset.dm;curQ=null;qStreak=0;renderDojo();
};
$("#dojoDecks").onclick=e=>{
  const b=e.target.closest("button[data-dk]");if(!b)return;
  dojoDeck=b.dataset.dk;curQ=null;renderDojo();
};
$("#qbox").onclick=e=>{
  const b=e.target.closest("button[data-oi]");if(!b)return;
  answerQuiz(Number(b.dataset.oi),b);
};
$("#cform").onsubmit=e=>{
  e.preventDefault();
  const q=$("#cq").value.trim(),r=$("#cr").value.trim(),m=$("#cm").value.trim();
  if(!q||!m){toast("请填写日语词汇和中文释义");return}
  const cl=S.flags.custom||(S.flags.custom=[]);
  if(cl.length>=150){toast("自建生词已达 150 条上限，请先清理已掌握词条");return}
  cl.push({q,r:r||q,m});
  $("#cq").value="";$("#cr").value="";$("#cm").value="";
  fx(680);toast(`➕ 已将「${q}」加入专属词库`);
  if(dojoDeck==="wb")curQ=null;
  save();renderDojo();
};
$("#customList").onclick=e=>{
  const b=e.target.closest("button[data-delc]");if(!b)return;
  const idx=Number(b.dataset.delc),cl=S.flags.custom||[];
  if(cl[idx]){cl.splice(idx,1);curQ=null;save();renderDojo()}
};
$("#shrine").onclick=e=>{
  const b=e.target.closest("button[data-pet]");if(!b)return;
  S.flags.pet=b.dataset.pet;petCustomSay=null;
  const p=curPet();speakJP(p.s.split("|")[0]);
  toast(`${p.e} 已设「${p.n}」为你的专注伴学灵！`);
  save();renderPet();renderShrine();
};

/* 键盘快捷键：专注页空格暂停/开始，道场页 1-4 选题 / R 朗读，Esc 关弹窗 */
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!lock&&$("#veil").classList.contains("on")){unmodal();return}
  if($("#veil").classList.contains("on"))return;
  if(e.target instanceof Element&&e.target.closest("input,textarea,select,[contenteditable]"))return;
  if(TAB==="dojo"){
    if(["1","2","3","4"].includes(e.key)){
      const idx=Number(e.key)-1,btn=document.querySelector(`#qbox .opt[data-oi="${idx}"]`);
      if(btn&&!btn.disabled){e.preventDefault();answerQuiz(idx,btn)}
      return;
    }
    if((e.key==="r"||e.key==="R")&&curQ){e.preventDefault();speakJP(curQ.q);return}
  }
  if(TAB==="focus"&&e.code==="Space"&&!e.repeat&&!(e.target instanceof Element&&e.target.closest("button,a"))){
    e.preventDefault();toggle();
  }
});

/* 全局每秒心跳：仅在 loaded 后执行业务结算 */
setInterval(()=>{
  tickN++;
  if(loaded&&S.session&&S.session.run){
    if(syncBlock(Date.now())){checkBadges();save();renderDash()}
  }
  renderBar();
  if(loaded&&tickN%10===0){if(S.session)flush();checkBadges();renderDash()}
  if(loaded&&tickN%60===0&&S.session)save();
},1000);

render();
boot();
document.addEventListener("visibilitychange",()=>{
  if(!loaded)return;
  if(document.hidden){if(dirty.size||pushT||S.session)push(true)}
  else pull().catch(()=>setSync("同步失败"));
});
addEventListener("pagehide",()=>{if(loaded&&(dirty.size||pushT||S.session))push(true)});
</script>
</body>
</html>
